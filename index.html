<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>高等数学随堂测验</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.page{max-width:520px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fff;border-radius:12px;padding:20px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px}
h1{font-size:20px;text-align:center;margin:26px 0 6px}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:22px}
label{display:block;font-size:14px;color:#555;margin-bottom:8px}
input[type=text]{width:100%;padding:13px 12px;border:1px solid #ddd;border-radius:8px;font-size:16px;outline:none}
input[type=text]:focus{border-color:#4a7cf7}
input[type=number]{width:90px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:17px;font-weight:600;background:#4a7cf7;color:#fff;margin-top:16px;cursor:pointer}
.btn:active{opacity:.85}
.btn.gray{background:#eee;color:#666}
.btn.small{width:auto;display:inline-block;padding:9px 18px;font-size:14px;margin-top:0}
.btn:disabled{opacity:.5}
.q-tit{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:12px}
.q-num{display:inline-block;background:#4a7cf7;color:#fff;font-size:12px;border-radius:6px;padding:2px 8px;margin-right:8px;vertical-align:2px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid #e3e6ee;border-radius:10px;padding:12px;margin-bottom:10px;font-size:15px;line-height:1.5;cursor:pointer;transition:all .15s}
.opt .tag{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:13px;color:#666}
.opt.sel{border-color:#4a7cf7;background:#eef4ff}
.opt.sel .tag{background:#4a7cf7;border-color:#4a7cf7;color:#fff}
.score{font-size:44px;font-weight:700;color:#4a7cf7}
.pass{display:inline-block;margin-top:8px;padding:4px 16px;border-radius:20px;font-size:14px;font-weight:600}
.pass.y{background:#e6f7ec;color:#18a058}
.pass.n{background:#fdeaea;color:#d93535}
.ans-item{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.5}
.ans-item:last-child{border-bottom:none}
.ans-item .ok{color:#18a058;font-weight:600;flex:none}
.ans-item .no{color:#d93535;font-weight:600;flex:none}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{border:1px solid #e3e6ee;padding:6px 4px;text-align:center;word-break:break-all}
th{background:#f7f9fc}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.row .btn{margin-top:0}
.muted{color:#999;font-size:12px;text-align:center;margin-top:10px}
.tip{color:#4a7cf7;font-size:13px;text-align:center;margin-top:10px}
.link{color:#4a7cf7;font-size:13px;text-align:center;margin-top:18px;cursor:pointer;text-decoration:underline}
.hide{display:none}
</style>
</head>
<body>

<!-- 首页 -->
<div id="pgHome" class="page">
  <h1>高等数学随堂测验</h1>
  <div class="sub">大专高等数学 · 单选题 · 共10题 · 满分100</div>
  <div class="card">
    <label>请输入学生姓名</label>
    <input type="text" id="nameInput" placeholder="例如：张三" maxlength="20">
    <button class="btn" id="startBtn" onclick="startQuiz()">开始答题</button>
  </div>
  <div class="link" onclick="showAdmin()">后台管理（成绩查询）</div>
</div>

<!-- 答题页 -->
<div id="pgQuiz" class="page hide">
  <div class="card" id="quizCard"></div>
  <button class="btn" id="subBtn" onclick="submitQuiz()">提交答卷</button>
</div>

<!-- 成绩页 -->
<div id="pgResult" class="page hide">
  <div class="card" style="text-align:center" id="resHead"></div>
  <div class="card" id="resDetail"></div>
  <button class="btn gray" onclick="backHome()">返回首页</button>
</div>

<!-- 后台登录 -->
<div id="pgAdminLogin" class="page hide">
  <h1>后台管理</h1>
  <div class="sub">请输入管理密码</div>
  <div class="card">
    <label>管理密码</label>
    <input type="text" id="pwdInput" placeholder="请输入管理密码">
    <button class="btn" onclick="adminLogin()">进入后台</button>
  </div>
  <div class="link" onclick="backHome()">返回首页</div>
</div>

<!-- 后台 -->
<div id="pgAdmin" class="page hide">
  <h1>答卷后台</h1>
  <div class="sub">云端共 <span id="subCount">0</span> 份答卷　<span class="tip" id="syncTip" style="display:inline"></span></div>
  <div class="card">
    <label>合格分数线（满分100）</label>
    <input type="number" id="passLine" min="0" max="100" value="60" onchange="savePassLine()">
    <div class="row">
      <button class="btn small" style="background:#18a058" onclick="exportCSV()">导出Excel(CSV)</button>
      <button class="btn small" onclick="loadSubs(true)">刷新数据</button>
      <button class="btn small gray" onclick="clearAll()">清空记录</button>
    </div>
  </div>
  <div class="card" id="adminList"></div>
  <div class="link" onclick="backHome()">返回首页</div>
</div>

<script>
/* ================= 题库（10道大专高等数学单选题） ================= */
var QUESTIONS=[
 {q:"函数 f(x)=x²+1 的定义域是（ ）",opts:["全体实数 R","x＞0","x≥0","x≠0"],ans:0},
 {q:"极限 lim(x→2) (x²−4)/(x−2) 的值为（ ）",opts:["0","2","4","不存在"],ans:2},
 {q:"函数 y=sin x 的导数是（ ）",opts:["cos x","−cos x","−sin x","tan x"],ans:0},
 {q:"∫ 2x dx =（ ）",opts:["x²","x²+C","2x²+C","x²/2+C"],ans:1},
 {q:"函数 f(x)=x³ 在 x=0 处的导数为（ ）",opts:["0","1","3","不存在"],ans:0},
 {q:"lim(x→0) sin x / x =（ ）",opts:["0","1","∞","不存在"],ans:1},
 {q:"曲线 y=x² 在点 (1,1) 处的切线斜率是（ ）",opts:["1","2","1/2","4"],ans:1},
 {q:"∫₀¹ x dx =（ ）",opts:["1","1/2","2","1/3"],ans:1},
 {q:"函数 y=ln x 的定义域是（ ）",opts:["x＞0","x≥0","全体实数","x≠1"],ans:0},
 {q:"d(e²ˣ)/dx =（ ）",opts:["e²ˣ","2e²ˣ","2x·e²ˣ","e²"],ans:1}
];
var ADMIN_PWD="admin123";
/* 云端存储：GitHub 仓库 quiz 的 data/ 目录，一人一文件，天然不冲突 */
var TOK1="ghp_MjkBxQwkydhgmw7TxpItxQrNhtXKsO1sA",TOK2="wRS";
var GH="https://api.github.com/repos/phgithum/cloud-db";
var GH_H={"Authorization":"Bearer "+TOK1+TOK2,"Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"quiz-h5"};

/* ================= 状态 ================= */
var answers=new Array(QUESTIONS.length).fill(-1);
var studentName="";
var CLOUD=[]; // 后台云端记录缓存
function localCache(){try{return JSON.parse(localStorage.getItem("quiz_subs")||"[]")}catch(e){return[]}}
function saveLocalCache(a){try{localStorage.setItem("quiz_subs",JSON.stringify(a))}catch(e){}}
function passLine(){var v=parseInt((localStorage.getItem("quiz_passline")||"60"),10);return isNaN(v)?60:v}

function show(id){["pgHome","pgQuiz","pgResult","pgAdminLogin","pgAdmin"].forEach(function(p){document.getElementById(p).classList.add("hide")});document.getElementById(id).classList.remove("hide");window.scrollTo(0,0)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ================= 首页 / 答题 ================= */
function startQuiz(){
  var n=document.getElementById("nameInput").value.trim();
  if(!n){alert("请先输入姓名");return}
  studentName=n;answers=new Array(QUESTIONS.length).fill(-1);
  renderQuiz();show("pgQuiz");
}
function renderQuiz(){
  var h="";
  QUESTIONS.forEach(function(q,i){
    h+='<div style="margin-bottom:22px"><div class="q-tit"><span class="q-num">'+(i+1)+'</span>'+esc(q.q)+'</div>';
    q.opts.forEach(function(o,j){
      h+='<div class="opt'+(answers[i]===j?' sel':'')+'" onclick="pick('+i+','+j+')"><span class="tag">'+"ABCD"[j]+'</span><span>'+esc(o)+'</span></div>';
    });
    h+='</div>';
  });
  var done=answers.filter(function(a){return a>=0}).length;
  h+='<div class="muted">已答 '+done+' / '+QUESTIONS.length+' 题</div>';
  document.getElementById("quizCard").innerHTML=h;
}
function pick(i,j){answers[i]=j;renderQuiz()}

function submitQuiz(){
  if(answers.indexOf(-1)>=0 && !confirm("还有 "+answers.filter(function(a){return a<0}).length+" 题没答，确定提交吗？"))return;
  var score=0,detail=[];
  QUESTIONS.forEach(function(q,i){
    var ok=answers[i]===q.ans;
    if(ok)score+=10;
    detail.push({ok:ok,my:answers[i]});
  });
  var rec={name:studentName,time:new Date().toLocaleString("zh-CN",{hour12:false}),ts:Date.now(),score:score,detail:detail};
  var b=document.getElementById("subBtn");b.disabled=true;b.textContent="提交中…";
  // 云端保存（一人一文件不冲突）＋本机备份双保险
  uploadSub(rec).then(function(ok){
    b.disabled=false;b.textContent="提交答卷";
    if(!ok){ // 云端失败 → 本机暂存，后台打开时自动补传
      var c=localCache();c.push(rec);saveLocalCache(c);
    }
    renderResult(rec);show("pgResult");
  });
}
function uploadSub(rec){
  var path="data/"+rec.ts+"_"+Math.random().toString(36).slice(2,8)+".json";
  return fetch(GH+"/contents/"+path,{
    method:"PUT",headers:GH_H,
    body:JSON.stringify({message:"quiz: "+rec.name,branch:"main",
      content:btoa(unescape(encodeURIComponent(JSON.stringify(rec))))})
  }).then(function(r){return r.ok}).catch(function(){return false});
}

function renderResult(rec){
  var pl=passLine(),pass=rec.score>=pl;
  document.getElementById("resHead").innerHTML=
    '<div style="font-size:15px;color:#666">'+esc(rec.name)+' 的成绩</div>'+
    '<div class="score">'+rec.score+'</div><div style="font-size:13px;color:#999">满分 100</div>'+
    '<div class="pass '+(pass?'y':'n')+'">'+(pass?'✔ 合格':'✘ 不合格')+'（分数线 '+pl+' 分）</div>';
  var h="";
  QUESTIONS.forEach(function(q,i){
    var d=rec.detail[i];
    h+='<div class="ans-item"><span class="'+(d.ok?'ok':'no')+'">'+(d.ok?'✔':'✘')+'</span>'+
       '<span><b>'+(i+1)+'.</b> '+esc(q.q)+'<br>你的答案：<b style="color:'+(d.ok?'#18a058':'#d93535')+'">'+
       (d.my<0?'未作答':"ABCD"[d.my])+'</b>'+(d.ok?'':'　正确答案：<b style="color:#18a058">'+"ABCD"[q.ans]+'</b>')+'</span></div>';
  });
  document.getElementById("resDetail").innerHTML=h;
}
function backHome(){document.getElementById("nameInput").value="";show("pgHome")}

/* ================= 后台 ================= */
function showAdmin(){
  if(sessionStorage.getItem("quiz_admin")==="1"){renderAdmin();show("pgAdmin");loadSubs(true)}
  else{document.getElementById("pwdInput").value="";show("pgAdminLogin")}
}
function adminLogin(){
  if(document.getElementById("pwdInput").value===ADMIN_PWD){sessionStorage.setItem("quiz_admin","1");renderAdmin();show("pgAdmin");loadSubs(true)}
  else alert("密码错误");
}
function savePassLine(){
  var v=parseInt(document.getElementById("passLine").value,10);
  if(isNaN(v)||v<0)v=0;if(v>100)v=100;
  localStorage.setItem("quiz_passline",String(v));renderAdmin();
}
function syncTip(t){document.getElementById("syncTip").textContent=t}

function loadSubs(manual){
  syncTip("云端同步中…");
  fetch(GH+"/contents/data?ref=main",{headers:GH_H}).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
  }).then(function(list){
    if(!Array.isArray(list))list=[];
    var jobs=(list||[]).filter(function(f){return /\.json$/.test(f.name)}).map(function(f){
      return fetch(f.url,{headers:GH_H}).then(function(r){return r.json()}).then(function(d){
        try{return JSON.parse(decodeURIComponent(escape(atob(d.content))))}catch(e){return null}
      }).catch(function(){return null});
    });
    return Promise.all(jobs);
  }).then(function(recs){
    var cloud=recs.filter(function(r){return r&&r.name});
    // 本机暂存未传成功的补传
    var pend=localCache();
    if(pend.length){
      Promise.all(pend.map(uploadSub)).then(function(oks){
        var keep=pend.filter(function(_,i){return !oks[i]});
        saveLocalCache(keep);
        if(oks.some(Boolean)){setTimeout(function(){loadSubs(false)},1200)}
      });
    }
    CLOUD=cloud;renderAdmin();syncTip("已同步 ✓");
  }).catch(function(e){
    // 云端拉不到就用本机缓存
    CLOUD=localCache();renderAdmin();
    syncTip(manual?"云端拉取失败，显示本机缓存":"本机缓存");
  });
}
function allRecs(){
  var map={};
  CLOUD.forEach(function(r){map[r.ts+"_"+r.name]=r});
  localCache().forEach(function(r){if(!map[r.ts+"_"+r.name])map[r.ts+"_"+r.name]=r});
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.ts-a.ts});
}
function renderAdmin(){
  var all=allRecs(),pl=passLine();
  document.getElementById("subCount").textContent=all.length;
  document.getElementById("passLine").value=pl;
  if(!all.length){document.getElementById("adminList").innerHTML='<div class="muted" style="padding:20px">暂无答卷记录</div>';return}
  var h='<table><tr><th>姓名</th><th>提交时间</th><th>得分</th><th>判定</th><th>每题作答</th></tr>';
  all.forEach(function(r){
    var det=r.detail.map(function(d,i){return (i+1)+":"+(d.my<0?"-":"ABCD"[d.my])+(d.ok?"√":"×")}).join(" ");
    h+='<tr><td>'+esc(r.name)+'</td><td>'+esc(r.time||"")+'</td><td><b>'+r.score+'</b></td>'+
       '<td style="color:'+(r.score>=pl?'#18a058':'#d93535')+'">'+(r.score>=pl?'合格':'不合格')+'</td>'+
       '<td style="text-align:left;font-size:11px">'+esc(det)+'</td></tr>';
  });
  h+='</table>';
  document.getElementById("adminList").innerHTML=h;
}
function clearAll(){
  if(!confirm("确定清空全部云端答卷记录？此操作不可恢复！"))return;
  syncTip("清空中…");
  fetch(GH+"/contents/data?ref=main",{headers:GH_H}).then(function(r){return r.json()}).then(function(list){
    if(!Array.isArray(list))return [];
    return Promise.all(list.map(function(f){
      return fetch(GH+"/contents/"+f.path,{method:"DELETE",headers:GH_H,
        body:JSON.stringify({message:"del",branch:"main",sha:f.sha})}).catch(function(){});
    }));
  }).then(function(){saveLocalCache([]);CLOUD=[];renderAdmin();syncTip("已清空 ✓")})
   .catch(function(){syncTip("清空失败，请重试")});
}

/* ================= 导出 CSV ================= */
function exportCSV(){
  var all=allRecs();
  if(!all.length){alert("暂无记录可导出");return}
  var rows=[["姓名","提交时间","总分","合格判定"].concat(QUESTIONS.map(function(q,i){return "第"+(i+1)+"题"}))];
  var pl=passLine();
  all.forEach(function(r){
    rows.push([r.name,r.time,r.score,r.score>=pl?"合格":"不合格"].concat(
      r.detail.map(function(d){return (d.my<0?"未答":"ABCD"[d.my])+(d.ok?"(√)":"(×)")})));
  });
  var csv="\uFEFF"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="答卷记录_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
}

document.getElementById("pwdInput").addEventListener("keydown",function(e){if(e.key==="Enter")adminLogin()});
document.getElementById("nameInput").addEventListener("keydown",function(e){if(e.key==="Enter")startQuiz()});
</script>
</body>
</html>
