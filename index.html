<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>在线考试系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--main:#2456c4;--main-d:#1c46a3;--main-l:#eef3fd;--bg:#f2f4f8;--line:#e4e8f0;--tx:#1c2330;--sub:#7b8496;--ok:#159c52;--no:#d93a3a;--warn:#c77d0a}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px}
.page{max-width:640px;margin:0 auto;padding:20px 16px 56px}
.card{background:#fff;border-radius:10px;padding:20px 18px;box-shadow:0 1px 3px rgba(20,30,60,.06);margin-bottom:14px;border:1px solid var(--line)}
h1{font-size:20px;font-weight:700;margin:8px 0 6px;line-height:1.35}
.sub{color:var(--sub);font-size:13px;margin:0 0 20px}
label{display:block;font-size:13px;color:#4a5264;font-weight:500;margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=text],input[type=datetime-local],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;outline:none;background:#fff;font-family:inherit;color:var(--tx);transition:border .15s,box-shadow .15s}
textarea{min-height:68px;resize:vertical;font-size:14px;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(36,86,196,.1)}
input[type=checkbox]{accent-color:var(--main)}
/* 开关（toggle switch）—— 试卷设置里的勾选项 */
.sw{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute;margin:0}
.sw .sl{position:absolute;inset:0;background:#c9cfda;border-radius:22px;transition:.2s;cursor:pointer}
.sw .sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+.sl{background:var(--main)}
.sw input:checked+.sl:before{transform:translateX(18px)}
/* 紧凑信息 chips —— 卡片 meta 用 */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:11px;line-height:1;padding:4px 8px;border-radius:9px;background:var(--main-l);color:#34618e;white-space:nowrap}
.chip.r{background:#fdeeee;color:#d93a3a}
.chip.g{background:#e8f7ef;color:#159c52}
.chip.w{background:#fdf3e3;color:#c77d0a}
.chip.gray{background:#eef1f6;color:#7b8496}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:600;background:var(--main);color:#fff;margin-top:16px;cursor:pointer;letter-spacing:2px;transition:background .15s}
.btn:active{background:var(--main-d)}
.btn.gray{background:#fff;color:#4a5264;border:1px solid var(--line)}
.btn.gray:active{background:#f5f7fa}
.btn.green{background:#fff;color:var(--main);border:1px solid #c9d6ef}
.btn.green:active{background:#f5f8fd}
.btn.red{background:#fff;color:var(--no);border:1px solid var(--line)}
.btn.small{width:auto;display:inline-block;padding:7px 14px;font-size:13px;margin-top:0;border-radius:6px;letter-spacing:0}
.btn:disabled{opacity:.45;cursor:default}
.paper{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:#fff;cursor:pointer;transition:border .15s,box-shadow .15s;position:relative;overflow:hidden}
.paper:hover{border-color:#c4d2f0;box-shadow:0 3px 10px rgba(36,86,196,.08)}
.paper::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--main);opacity:.85}
.paper .pt{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.5}
.paper .pm{font-size:13px;color:var(--sub);line-height:1.9}
.paper em{font-style:normal;color:#8a93a5;font-size:12px;margin-right:2px}
.st{display:inline-block;font-size:12px;margin-left:8px;vertical-align:2px;color:#98a0ae;font-weight:400}
.st.ing{color:var(--ok)}
.st.early{color:var(--warn)}
.st.over{background:#f0f1f4;color:#98a0ae}
.q-tit{font-size:15px;font-weight:600;line-height:1.7;margin-bottom:14px}
.qimg{max-width:100%;border-radius:8px;margin:8px 0 4px;display:block;border:1px solid var(--line)}
.qimg-th{max-height:64px;max-width:140px;border-radius:6px;border:1px solid var(--line);cursor:pointer;display:block}
.q-num{display:inline-block;color:var(--main);font-weight:700;margin-right:6px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:9px;font-size:15px;line-height:1.6;cursor:pointer;transition:all .12s;background:#fff}
.opt:hover{border-color:#b9c8ea}
.opt .tag{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c9d0dc;display:flex;align-items:center;justify-content:center;font-size:13px;color:#5a6375;font-weight:600;transition:all .12s}
.opt.sel{border-color:var(--main);background:var(--main-l);box-shadow:inset 0 0 0 1px var(--main)}
.opt.sel .tag{background:var(--main);border-color:var(--main);color:#fff}
.score{font-size:48px;font-weight:700;color:var(--main);font-variant-numeric:tabular-nums;line-height:1.2}
.pass{display:inline-block;margin-top:10px;padding:5px 18px;border-radius:99px;font-size:14px;font-weight:600}
.pass.y{background:#e5f6ec;color:var(--ok)}
.pass.n{background:#fdeaea;color:var(--no)}
.ans-item{display:flex;gap:10px;padding:12px 4px;border-bottom:1px solid #f0f2f6;font-size:14px;line-height:1.7}
.ans-item:last-child{border-bottom:none}
.ans-item .ok{color:var(--ok);font-weight:600;flex:none}
.ans-item .no{color:var(--no);font-weight:600;flex:none}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
th,td{border:1px solid var(--line);padding:7px 5px;text-align:center;word-break:break-all}
th{background:#f6f8fc;color:#4a5264;font-weight:600}
tr:nth-child(even) td{background:#fafbfe}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row .btn{margin-top:0}
.muted{color:#9aa2b1;font-size:12px;text-align:center;margin-top:10px}
.tip{color:var(--main);font-size:13px}
.warn{color:var(--no);font-size:13px}
.link{color:var(--main);font-size:13px;text-align:center;margin-top:20px;cursor:pointer}
.link:hover{text-decoration:underline}
.tabs{display:flex;gap:22px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs .btn{width:auto;background:none;color:var(--sub);border:none;border-radius:0;padding:10px 2px;font-size:15px;font-weight:600;letter-spacing:0;margin:0;position:relative}
.tabs .btn:active{background:none}
.tabs .btn.gray{color:var(--sub);border:none;background:none}
.tabs .btn:not(.gray){color:var(--main)}
.tabs .btn:not(.gray)::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--main);border-radius:2px}
.qedit{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:#fafbfd}
.qedit .del{color:var(--no);font-size:12px;cursor:pointer;float:right}
.qedit .del:hover{text-decoration:underline}
.optrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.optrow input[type=text]{flex:1;padding:8px 10px;font-size:14px}
.optrow .ck{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ok)}
.info-box{background:var(--main-l);border-radius:8px;padding:12px 14px;font-size:13px;color:#33415e;line-height:1.9;border-left:3px solid var(--main)}
.hide{display:none}
</style>
</head>
<body>

<!-- ============ 首页：卷子列表 ============ -->
<div id="pgHome" class="page">
  <h1>在线考试</h1>
  <div class="sub">选择一张卷子开始答题</div>
  <div id="paperList"></div>
  <div class="row" style="justify-content:space-between;align-items:center;margin-top:16px"><span class="link" style="margin-top:0" onclick="reloadHome()">刷新考试列表</span><span class="link" style="margin-top:0" onclick="showAdmin()">后台管理</span></div>
</div>

<!-- ============ 输入姓名 ============ -->
<div id="pgName" class="page hide">
  <h1 id="pTitle">考试</h1>
  <div class="sub" id="pMeta"></div>
  <div class="card">
    <div class="info-box" id="pInfo"></div>
    <label style="margin-top:14px">请输入编号 / 姓名</label>
    <input type="text" id="nameInput" placeholder="输入你的编号或姓名" maxlength="20">
    <div class="muted" id="nameHint" style="text-align:left;margin-top:6px">同一姓名的答题次数由系统严格记录，用完将无法再次进入</div>
    <button class="btn" id="startBtn" onclick="startExam()">开始答题</button>
  </div>
  <div class="link" id="backLink" onclick="backHome()">返回选择卷子</div>
</div>

<!-- ============ 答题页 ============ -->
<div id="pgQuiz" class="page hide">
  <div class="card" id="quizCard"></div>
  <button class="btn" id="subBtn" onclick="submitQuiz()">提交答卷</button>
</div>

<!-- ============ 成绩页 ============ -->
<div id="pgResult" class="page hide">
  <div class="card" style="text-align:center" id="resHead"></div>
  <div class="card" id="resDetail"></div>
  <button class="btn gray" onclick="backHome()">返回首页</button>
</div>

<!-- ============ 后台登录 ============ -->
<div id="pgAdminLogin" class="page hide">
  <h1>后台管理</h1>
  <div class="sub">请使用聚合后台账户登录 · <span id="verTag"></span></div>
  <div class="card">
    <label>账户（超管填 panhao）</label>
    <input type="text" id="userInput" placeholder="账户名">
    <label>密码</label>
    <input type="text" id="pwdInput" placeholder="密码">
    <button class="btn" onclick="adminLogin()">进入后台</button>
  </div>
  <div class="link" onclick="backHome()">返回首页</div>
</div>

<!-- ============ 后台 ============ -->
<div id="pgAdmin" class="page hide">
  <h1>考试后台</h1>
  <div class="sub" id="whoBar"></div>
  <div class="tabs">
    <button class="btn small" id="tabB1" onclick="switchTab(0)">试卷管理</button>
    <button class="btn small gray" id="tabB2" onclick="switchTab(1)">成绩查询</button>
    <button class="btn small gray" id="tabB4" onclick="loadSubs(true)">刷新数据</button>
    <button class="btn small gray" id="tabB3" onclick="adminLogout()">退出登录</button>
  </div>

  <!-- 试卷列表 -->
  <div id="tabPapers">
    <div class="card">
      <div class="row"><button class="btn small green" onclick="editPaper(null)">新建试卷</button>
      <button class="btn small" onclick="loadPapers(function(l){PAPERS=l;renderPaperAdmin()})">刷新</button></div>
      <div class="tip" id="papersTip" style="margin-top:10px"></div>
    </div>
    <div id="paperAdminList"></div>
  </div>

  <!-- 试卷编辑 -->
  <div id="tabEdit" class="hide">
    <div class="card">
      <label>试卷标题</label>
      <input type="text" id="cfgTitle" placeholder="例如：高数第一章测验">
      <label>开始时间（不填=立即开始）</label>
      <input type="datetime-local" id="cfgOpen">
      <label>结束时间（不填=不限制）</label>
      <input type="datetime-local" id="cfgClose">
      <label>每人最多答题次数</label>
      <input type="number" id="cfgTries" min="1" max="99" value="1">
      <label>切屏检测（允许切出次数，0 = 不检测）</label>
      <input type="number" id="cfgSwitch" min="0" max="99" value="0">
      <div style="font-size:12px;color:#999;margin-top:4px">答题期间切到别的软件 / 别的标签页 / 最小化都会记一次；超过上限直接锁定无法答题。0 = 本次考试不开启</div>
      <label>考试限时（分钟，0 = 不限时）</label>
      <input type="number" id="cfgLimit" min="0" max="600" value="0">
      <div style="font-size:12px;color:#999;margin-top:4px">开考后倒计时（切屏刷新时间照走），时间一到自动交卷</div>
      <label>多选题每题分值（0 = 全部题目平均分）</label>
      <input type="number" id="cfgScoreMulti" min="0" max="50" value="0">
      <div style="font-size:12px;color:#999;margin-top:4px">例如设 20：每道多选题固定 20 分，其余题目平分剩下的分数；填 0 则所有题平均分</div>
      <label>合格分数线（0-100）</label>
      <input type="number" id="cfgPass" min="0" max="100" value="60">
      <label style="margin-top:14px"><span style="display:flex;align-items:center;gap:8px;font-weight:400"><span class="sw"><input type="checkbox" id="cfgShowAns"><span class="sl"></span></span> 提交后向学生显示得分和正确答案</span><span style="display:block;font-size:12px;color:#999;margin-top:4px">关闭 = 学生交卷只见「已提交」，成绩由老师统一公布</span></label>
      <label style="margin-top:14px">抽题数（题库共 N 题，每个学生随机抽 M 题；不填或填 0 = 全部题目）</label>
      <input type="number" id="cfgDraw" min="0" max="999" value="0" placeholder="0=全部">
      <label style="margin-top:14px"><span style="display:flex;align-items:center;gap:8px;font-weight:400"><span class="sw"><input type="checkbox" id="cfgShufQ"><span class="sl"></span></span> 打乱题目顺序</span><span style="display:block;font-size:12px;color:#999;margin-top:4px">每个学生开考时题目随机排序</span></label>
      <label style="margin-top:10px"><span style="display:flex;align-items:center;gap:8px;font-weight:400"><span class="sw"><input type="checkbox" id="cfgShufO"><span class="sl"></span></span> 打乱选项顺序</span><span style="display:block;font-size:12px;color:#999;margin-top:4px">每个学生开考时每题选项随机排序（答案自动跟着选项走）</span></label>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px">题目编辑（<span id="qCount">0</span> 题，每题分值 = 100÷题数）</div>
      <div id="qList"></div>
      <div class="row">
        <button class="btn small" onclick="addQ('single')">单选题</button>
        <button class="btn small" onclick="addQ('multi')">多选题</button>
        <button class="btn small" onclick="addQ('judge')">判断题</button>
        <button class="btn small" onclick="addQ('blank')">填空题</button>
        <button class="btn small" style="background:#c77d0a" onclick="addQ('survey')">调研题</button>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <button class="btn small green" id="saveCfgBtn" onclick="savePaper()">保存并发布</button>
        <button class="btn small gray" onclick="cancelEdit()">放弃修改</button>
      </div>
      <div class="tip" id="cfgTip" style="margin-top:10px"></div>
    </div>
  </div>

  <!-- 成绩查询 -->
  <div id="tabScore" class="hide">
    <div class="card">
      <div>云端共 <b id="subCount">0</b> 份答卷　<span class="tip" id="syncTip"></span></div>
      <label>按试卷筛选</label>
      <select id="paperFilter" onchange="SCORE_VIEW=this.value||null;renderAdmin()"><option value="">全部试卷</option></select>
      <div class="row" id="exportRow">
        <span style="font-size:12px;color:#7b8496;align-self:center">只导出低于</span>
        <input id="scoreBelow" type="number" min="0" max="100" placeholder="不限" style="width:64px;margin:0">
        <span style="font-size:12px;color:#7b8496;align-self:center">分</span>
        <button class="btn small" style="background:#18a058" onclick="exportCSV()">导出成绩(Excel)</button>
        <button class="btn small" onclick="exportWrong()">导出错题(Excel)</button>
        <button class="btn small" onclick="loadSubs(true)">刷新数据</button>
        <button class="btn small gray" onclick="clearAll()">清空记录</button>
      </div>
    </div>
    <div class="card" id="statBox"></div>
    <div class="card" id="adminList"></div>
  </div>
  <div class="link" onclick="backHome()">返回首页</div>
</div>

<script>
"use strict";
/* =====================================================
   在线考试系统 V20260910h（重构版）
   答题次数三重管控：
   ① 进入时：云端记录 + 本机记录 取大值校验
   ② 交卷时：重新拉取云端实时记录二次校验，超次拒绝提交
   ③ 本机锁：交卷成功后本机锁定该姓名，换网络/断网也拦
   ===================================================== */

/* ================= 云端（统一库 cloud-db） ================= */
var TOK1="ghp_MjkBxQwkydhgmw7TxpItxQrNhtXKsO1sA",TOK2="wRS";
var GH="https://api.github.com/repos/phgithum/cloud-db";
var RAW="https://raw.githubusercontent.com/phgithum/cloud-db/main";
function ghH(){return{"Authorization":"Bearer "+TOK1+TOK2,"Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"quiz-h5"}}

/* ================= 全局状态 ================= */
var PAPERS=[],CLOUD=[],EDIT=null,answers=[],studentName="",CUR=null,EXAM_QS=[],DIRECT=false,otherTexts=[];
var CUR_USER="",IS_MASTER=false;
function localCache(){try{return JSON.parse(localStorage.getItem("quiz_subs")||"[]")}catch(e){return[]}}
function saveLocalCache(a){try{localStorage.setItem("quiz_subs",JSON.stringify(a))}catch(e){}}
function show(id){["pgHome","pgName","pgQuiz","pgResult","pgAdminLogin","pgAdmin"].forEach(function(p){document.getElementById(p).classList.add("hide")});document.getElementById(id).classList.remove("hide");window.scrollTo(0,0)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var TYPE_NAME={single:"单选",multi:"多选",judge:"判断",blank:"填空",survey:"调研"};

/* 姓名标准化：去首尾空格、压缩连续空格——保证"张三"和"张三 "算同一人 */
function normName(n){return String(n||"").trim().replace(/\s+/g," ")}

/* ================= 试卷读写 ================= */
function loadPapers(cb){
  /* 通道1：GitHub API 实时（带token必新） → 通道2：raw 实时 → 通道3：jsdelivr 兜底 */
  function viaApi(){
    fetch(GH+"/contents/exam/papers.json?ref=main&t="+Date.now(),{headers:ghH()})
      .then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(d){
        var j=null;
        try{j=JSON.parse(decodeURIComponent(escape(atob(d.content))))}catch(e){}
        cb(Array.isArray(j)?j:[]);
      }).catch(viaRaw);
  }
  function viaRaw(){
    fetch(RAW+"/exam/papers.json?t="+Date.now())
      .then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(j){cb(Array.isArray(j)?j:[])}).catch(viaCdn);
  }
  function viaCdn(){
    fetch("https://cdn.jsdelivr.net/gh/phgithum/cloud-db@main/exam/papers.json?t="+Date.now())
      .then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(j){cb(Array.isArray(j)?j:[])}).catch(function(){cb([])});
  }
  viaApi();
}
function savePapers(list,tipEl,okTxt){
  if(tipEl)tipEl.textContent="保存中…";
  var path=GH+"/contents/exam/papers.json";
  var body={message:"papers update",branch:"main",
    content:btoa(unescape(encodeURIComponent(JSON.stringify(list))))};
  return fetch(path+"?t="+Date.now(),{headers:ghH()})
    .then(function(r){return r.ok?r.json():null})
    .then(function(info){ if(info&&info.sha)body.sha=info.sha;
      return fetch(path,{method:"PUT",headers:ghH(),body:JSON.stringify(body)});
    }).then(function(r){
      if(tipEl)tipEl.textContent=r.ok?(okTxt||"✔ 已发布，1分钟内全场生效"):"✘ 保存失败 HTTP "+r.status;
      return r.ok;
    }).catch(function(){if(tipEl)tipEl.textContent="✘ 网络失败，请重试";return false});
}
function pState(p){
  var now=Date.now();
  if(p.openT&&now<new Date(p.openT).getTime())return"early";
  if(p.closeT&&now>new Date(p.closeT).getTime())return"over";
  return"ing";
}
var ST_TXT={ing:"进行中",early:"未开始",over:"已结束"};
function fmtT(t){if(!t)return"";return new Date(t).toLocaleString("zh-CN",{hour12:false})}
function qTypeSummary(qs){
  var c={};qs.forEach(function(q){c[q.type]=(c[q.type]||0)+1});
  return Object.keys(c).map(function(k){return TYPE_NAME[k]+"×"+c[k]}).join(" / ");
}

/* ================= 答题次数管控（核心） ================= */
/* 本机锁定：key = 卷ID + 标准化姓名 */
function attKey(pid,name){return "quiz_att_"+pid+"_"+name}
function deviceAttempts(pid,name){return parseInt(localStorage.getItem(attKey(pid,name))||"0",10)||0}
function bumpDevice(pid,name){localStorage.setItem(attKey(pid,name),deviceAttempts(pid,name)+1)}

/* 云端实时拉取该姓名在该卷的已交次数；拉取失败时返回 null（由调用方决定降级策略） */
function cloudAttempts(name,pid,cb){
  fetchSubs().then(function(recs){
    if(recs==null)return cb(null);   /* 云端拉不到 */
    cb(recs.filter(function(r){return r&&r.paperId===pid&&normName(r.name)===name}).length);
  });
}

/* 综合校验：取 云端次数 与 本机次数 的最大值；云端拉不到时用本机次数兜底（绝不低于已知值） */
function checkAttempts(name,pid,cb){
  var dev=deviceAttempts(pid,name);
  cloudAttempts(name,pid,function(c){
    cb({used:Math.max(dev,c==null?0:c),dev:dev,cloud:c,offline:c==null});
  });
}

function openPaper(id){
  var p=PAPERS.filter(function(x){return x.id===id})[0];
  if(!p)return;
  CUR=p;
  document.getElementById("pTitle").textContent=p.title;
  var st=pState(p);
  var draw=Math.max(0,parseInt(p.draw||0,10)||0);
  document.getElementById("pMeta").textContent=qTypeSummary(p.questions)+"　题库 "+p.questions.length+" 题"+(draw>0?"　开考随机抽 "+draw+" 题":"")+"　满分 100";
  var info=["每人可答：<b>"+(p.tries||1)+"</b> 次　合格线："+(p.passLine!=null?p.passLine:60)+" 分"];
  if(draw>0)info.push("每人试卷从 "+p.questions.length+" 题题库中随机抽取 "+draw+" 题"+(p.shuffleQ?"，题目乱序":"")+(p.shuffleO?"，选项乱序":""));
  if(p.switchLimit>0)info.push('<span class="warn">⚠ 切屏检测：切出答题页面累计超过 '+p.switchLimit+' 次将无法继续答题</span>');
  if(p.openT)info.push("开始："+fmtT(p.openT));
  if(p.closeT)info.push('截止：<b>'+fmtT(p.closeT)+'</b>');
  if(st==="early")info.push('<span class="warn">⚠ 考试尚未开始，到点才能进</span>');
  if(st==="over")info.push('<span class="warn">⚠ 考试已结束</span>');
  if(p.stopped)info.unshift('<span class="warn">⚠ 该考试已被老师停止，无法作答</span>');
  document.getElementById("startBtn").disabled=(st!=="ing")||!!p.stopped;
  document.getElementById("startBtn").textContent="开始答题";
  document.getElementById("pInfo").innerHTML=info.join("<br>");
  document.getElementById("nameInput").value="";
  document.getElementById("nameHint").textContent="";
  document.getElementById("backLink").style.display=DIRECT?"none":"";
  show("pgName");
}
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function buildExam(){
  var qs=JSON.parse(JSON.stringify(CUR.questions));
  var draw=Math.max(0,parseInt(CUR.draw||0,10)||0);
  if(draw>0&&draw<qs.length)shuffleArr(qs).length=draw;else shuffleArr(qs);
  if(CUR.shuffleO){
    qs.forEach(function(q){
      if(!Array.isArray(q.ans)||!q.ans.length)return; /* 填空/调研无标准答案映射 */
      var idx=shuffleArr(q.opts.map(function(_,i){return i}));
      q.opts=idx.map(function(i){return q.opts[i]});
      q.ans=q.ans.map(function(a){return idx.indexOf(a)}).sort();
    });
  }
  return qs;
}

/* ---------- 开始考试（第一道锁：进入校验） ---------- */
function startExam(){
  var n=normName(document.getElementById("nameInput").value);
  if(!n){alert("请输入编号或姓名");return}
  var st=pState(CUR);
  if(st==="early"){alert("考试尚未开始，请等到 "+fmtT(CUR.openT));return}
  if(st==="over"){alert("考试已于 "+fmtT(CUR.closeT)+" 结束，不能再答题");return}
  if(CUR.stopped){alert("该考试已被老师停止，无法作答");return}
  var tries=Math.max(1,parseInt(CUR.tries,10)||1);
  var b=document.getElementById("startBtn");
  b.disabled=true;b.textContent="检查答题次数…";
  checkAttempts(n,CUR.id,function(a){
    b.disabled=false;b.textContent="开始答题";
    if(a.used>=tries){
      var src=a.offline?"（本机记录）":"";
      alert("姓名「"+n+"」在这张卷子上已答满 "+tries+" 次"+src+"，不能再进入。\n如确需重考，请联系老师在后台删除该姓名的成绩记录。");
      return;
    }
    document.getElementById("nameHint").textContent="该姓名已答 "+a.used+" / "+tries+" 次，本次为第 "+(a.used+1)+" 次";
    studentName=n;
    EXAM_QS=buildExam();
    otherTexts=EXAM_QS.map(function(){return ""});
    answers=EXAM_QS.map(function(q){
      if(q.type==="blank")return"";
      if(q.type==="survey")return q.multi?[]:-1;
      return q.type==="multi"?[]:-1;
    });
    if(CUR.switchLimit>0)alert("切屏检测已开启：答题期间切出答题页面累计不能超过 "+CUR.switchLimit+" 次，超过将无法继续答题。\n请专心作答。");
    renderQuiz();show("pgQuiz");
    swStart(parseInt(CUR.switchLimit,10)||0);   /* 先弹提示再开启检测，避免提示弹窗自己的失焦被误计 */
    examTimerStart();   /* 限时考试开始倒计时（0=不限时） */
    stopPollStart();    /* 老师后台"停止考试"后，答题中的学生 1～5 分钟内被自动收卷 */
  });
}

/* ================= 答题 ================= */
function renderQuiz(){
  var h="";
  EXAM_QS.forEach(function(q,i){
    h+='<div style="margin-bottom:22px"><div class="q-tit"><span class="q-num">'+(i+1)+'</span>【'+(q.type==="survey"?TYPE_NAME[q.type]+(q.multi?"·多选":"·单选"):TYPE_NAME[q.type])+'】'+esc(q.q)+
       (q.type==="survey"?'<span style="font-size:12px;color:#c77d0a;font-weight:400">（调研题，不计分）</span>':'')+'</div>'+imgTag(q.img);
    if(q.type==="blank"){
      h+='<input type="text" value="'+esc(answers[i])+'" oninput="pickBlank('+i+',this.value)" placeholder="在此输入你的答案">';
    }else{
      var opts=q.opts.slice();
      if(q.type==="survey"&&q.other)opts.push("其他");
      opts.forEach(function(o,j){
        var isOther=(q.type==="survey"&&q.other&&j===opts.length-1);
        var sel=Array.isArray(answers[i])?answers[i].indexOf(j)>=0:answers[i]===j;
        var mark=isOther?'✎':'';
        h+='<div class="opt'+(sel?' sel':'')+'" onclick="pick('+i+','+j+')"><span class="tag">'+(isOther?'其他':(q.type==="survey"?(j+1):"ABCD"[j]))+'</span><span>'+esc(o)+'</span></div>';
        if(isOther&&sel){
          h+='<div style="margin:-4px 0 10px 36px"><input type="text" value="'+esc(otherTexts[i]||"")+'" oninput="pickOther('+i+',this.value)" placeholder="请填写说明…" onclick="event.stopPropagation()"></div>';
        }
      });
    }
    h+='</div>';
  });
  var done=answers.filter(function(a,i){return qAnswered(EXAM_QS[i],a)}).length;
  h+='<div class="muted">已答 '+done+' / '+EXAM_QS.length+' 题</div>';
  document.getElementById("quizCard").innerHTML=h;
}
function qAnswered(q,a){
  if(q.type==="blank")return !!(a&&String(a).trim());
  if(q.type==="survey")return Array.isArray(a)?a.length>0:a>=0;
  return Array.isArray(a)?a.length>0:a>=0;
}
function pick(i,j){
  var q=EXAM_QS[i];
  if(q.type==="survey"){
    if(q.multi){
      if(!Array.isArray(answers[i]))answers[i]=[];
      var k=answers[i].indexOf(j);
      if(k>=0)answers[i].splice(k,1);else answers[i].push(j);
      answers[i].sort();
    }else answers[i]=j;
  }else if(q.type==="multi"){
    var k=answers[i].indexOf(j);
    if(k>=0)answers[i].splice(k,1);else answers[i].push(j);
    answers[i].sort();
  }else answers[i]=j;
  renderQuiz();
}
function pickBlank(i,v){answers[i]=v;
  /* 不重绘，避免输入框失焦 */
  var done=answers.filter(function(a,i){return qAnswered(EXAM_QS[i],a)}).length;
  document.querySelector("#quizCard .muted").textContent="已答 "+done+" / "+EXAM_QS.length+" 题";
}
function pickOther(i,v){otherTexts[i]=v}

/* ---------- 提交（第二道锁：交卷前云端二次校验） ---------- */
function submitQuiz(auto){
  if(TIMER.sent)return;   /* 自动交卷只触发一次 */
  var un=answers.filter(function(a,i){return !qAnswered(EXAM_QS[i],a)}).length;
  if(un>0&&!auto&&!confirm("还有 "+un+" 题没答，确定提交吗？"))return;
  if(auto&&un>0)swStop();   /* 时间到自动交卷，未答的题按空处理 */
  TIMER.sent=true;
  var tries=Math.max(1,parseInt(CUR.tries,10)||1);
  var b=document.getElementById("subBtn");b.disabled=true;b.textContent="校验答题次数…";
  cloudAttempts(studentName,CUR.id,function(c){
    var dev=deviceAttempts(CUR.id,studentName);
    var used=Math.max(dev,c==null?0:c);
    if(c!=null&&used>=tries){
      b.disabled=false;b.textContent="提交答卷";
      bumpDevice(CUR.id,studentName);
      forceExit("姓名「"+studentName+"」的答题次数已用完（"+tries+" 次）。<br>本次作答未被提交。<br>如确需重考，请联系老师。");
      return;
    }
    /* 云端拉取失败时：只要本机还有剩余额度就放行（断网兜底），交卷后本地记账 */
    doSubmit();
  });
}
function doSubmit(){
  swStop();examTimerStop();   /* 交卷即停止切屏检测与倒计时 */
  var scoredQ=EXAM_QS.filter(function(q){return q.type!=="survey"});
  /* 计分：多选题可固定分值（老师设置 scoreMulti），其余题型平分剩余分；没设置则全部均分 */
  var mScore=parseInt(CUR.scoreMulti,10)||0;
  var multiN=scoredQ.filter(function(q){return q.type==="multi"}).length;
  var otherPer=0;
  if(mScore>0&&multiN>0&&mScore*multiN<100){
    var rest=100-mScore*multiN,otherN=scoredQ.length-multiN;
    otherPer=otherN>0?rest/otherN:0;
  }else mScore=0;
  var perDef=scoredQ.length?100/scoredQ.length:100;
  function perOf(q){return mScore>0?(q.type==="multi"?mScore:otherPer):perDef}
  var score=0,detail=[];
  EXAM_QS.forEach(function(q,i){
    var my=Array.isArray(answers[i])?answers[i].slice():answers[i];
    if(q.type==="survey"){
      var labels=(Array.isArray(my)?my:[my]).filter(function(v){return v!=null&&v>=0}).map(function(v){
        var isO=q.other&&v===q.opts.length;
        return isO?("其他："+(otherTexts[i]||"").trim()):q.opts[v];
      });
      detail.push({survey:true,ok:null,my:labels.join("、"),picks:labels,q:q.q,opts:q.opts,other:otherTexts[i]||"",img:q.img||""});
      return;
    }
    var per=perOf(q);
    if(q.type==="blank"){
      var t=String(my||"").trim(),ref=(q.ans||"").trim();
      var ok=ref?t.toLowerCase()===ref.toLowerCase():t.length>0;
      if(ok)score+=per;
      detail.push({ok:ok,my:t,q:q.q,ans:ref,img:q.img||""});
      return;
    }
    var ok=Array.isArray(my)?(my.length===q.ans.length&&my.every(function(v,k){return v===q.ans[k]})):my===q.ans[0];
    if(ok)score+=per;
    detail.push({ok:ok,my:my,q:q.q,opts:q.opts,ans:q.ans,img:q.img||""});
  });
  score=Math.round(score*10)/10;
  var rec={name:studentName,paperId:CUR.id,paperTitle:CUR.title,time:new Date().toLocaleString("zh-CN",{hour12:false}),ts:Date.now(),score:score,detail:detail,
           switchOut:(CUR.switchLimit>0?SW.count:undefined)};
  var b=document.getElementById("subBtn");b.disabled=true;b.textContent="提交中…";
  uploadSub(rec).then(function(ok){
    b.disabled=false;b.textContent="提交答卷";
    if(!ok){var c=localCache();c.push(rec);saveLocalCache(c)}
    bumpDevice(CUR.id,studentName); /* 第三道锁：交卷后本机立即记账 */
    renderResult(rec);show("pgResult");
  });
}
function uploadSub(rec){
  var path="data/"+rec.ts+"_"+Math.random().toString(36).slice(2,8)+".json";
  return fetch(GH+"/contents/"+path,{method:"PUT",headers:ghH(),
    body:JSON.stringify({message:"quiz: "+rec.name,branch:"main",
      content:btoa(unescape(encodeURIComponent(JSON.stringify(rec))))})
  }).then(function(r){return r.ok}).catch(function(){return false});
}
function renderResult(rec){
  var showAns=CUR.showAns!==false;
  if(!showAns){
    document.getElementById("resHead").innerHTML=
      '<div style="font-size:15px;color:#666">'+esc(rec.paperTitle)+' · '+esc(rec.name)+'</div>'+
      '<div style="font-size:17px;font-weight:600;color:#34618e;margin:14px 0 6px">✔ 已成功提交</div>'+
      '<div style="font-size:13px;color:#999">本次作答已记录，成绩待老师统一公布</div>';
    document.getElementById("resDetail").innerHTML='<div class="muted" style="padding:16px">本次考试不即时公布答案与得分</div>';
    return;
  }
  var pl=(CUR.passLine!=null?CUR.passLine:60),pass=rec.score>=pl;
  document.getElementById("resHead").innerHTML=
    '<div style="font-size:15px;color:#666">'+esc(rec.paperTitle)+' · '+esc(rec.name)+'</div>'+
    '<div class="score">'+rec.score+'</div><div style="font-size:13px;color:#999">满分 100</div>'+
    '<div class="pass '+(pass?'y':'n')+'">'+(pass?'✔ 合格':'✘ 不合格')+'（分数线 '+pl+' 分）</div>';
  var h="";
  EXAM_QS.forEach(function(q,i){
    var d=rec.detail[i];
    if(q.type==="survey"){
      h+='<div class="ans-item"><span class="ok" style="color:#c77d0a">◆</span>'+
         '<span><b>'+(i+1)+'.</b> 【调研】'+esc(q.q)+'<br>你的选择：<b style="color:#33415e">'+(d.my||"未作答")+'</b>'+imgTag(d.img)+'</span></div>';
      return;
    }
    if(q.type==="blank"){
      h+='<div class="ans-item"><span class="'+(d.ok?'ok':'no')+'">'+(d.ok?'✔':'✘')+'</span>'+
         '<span><b>'+(i+1)+'.</b> 【填空】'+esc(q.q)+'<br>你的答案：<b style="color:'+(d.ok?'#18a058':'#d93535')+'">'+esc(d.my||"未作答")+'</b>'+
         (d.ans?'　参考答案：<b style="color:#18a058">'+esc(d.ans)+'</b>':'')+imgTag(d.img)+'</span></div>';
      return;
    }
    var myTxt=Array.isArray(d.my)?(d.my.length?d.my.map(function(v){return "ABCD"[v]}).join(""):"未作答"):(d.my<0?"未作答":"ABCD"[d.my]);
    var okTxt=q.ans.map(function(v){return "ABCD"[v]}).join("");
    h+='<div class="ans-item"><span class="'+(d.ok?'ok':'no')+'">'+(d.ok?'✔':'✘')+'</span>'+
       '<span><b>'+(i+1)+'.</b> 【'+TYPE_NAME[q.type]+'】'+esc(q.q)+'<br>你的答案：<b style="color:'+(d.ok?'#18a058':'#d93535')+'">'+myTxt+'</b>'+
       (d.ok?'':'　正确答案：<b style="color:#18a058">'+okTxt+'</b>')+imgTag(d.img)+'</span></div>';
  });
  document.getElementById("resDetail").innerHTML=h;
}

function loadAccs(cb){
  var us=["https://phgithum.github.io/admin-console/accounts.json?t="+Date.now(),
          "https://raw.githubusercontent.com/phgithum/admin-console/main/accounts.json?t="+Date.now(),
          "https://cdn.jsdelivr.net/gh/phgithum/admin-console@main/accounts.json"];
  (function tryOne(i){
    if(i>=us.length){cb([]);return}
    fetch(us[i]).then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(j){cb(j||[])}).catch(function(){tryOne(i+1)});
  })(0);
}

function toggleStop(id){
  var p=PAPERS.filter(function(x){return x.id===id})[0];if(!p)return;

  if(!confirm(toStop?("确定停止「"+p.title+"」这场考试？\n停止后所有人立即无法进入；正在答题的人会在 1～5 分钟内被自动收卷。"):("确定恢复「"+p.title+"」？恢复后学生可正常作答。")))return;
  p.stopped=toStop;
  savePapers(PAPERS,document.getElementById("papersTip"),toStop?"停止中…":"恢复中…").then(function(ok){
    if(!ok){p.stopped=!toStop;return}

    document.getElementById("papersTip").textContent=toStop?"✔ 考试已停止":"✔ 考试已恢复";
  });

function delPaperRecords(p,cb,pass){
  pass=pass||1;
  var bad=function(r){return r.paperId===p.id||r.paperTitle===p.title};
  /* 本机待补传缓存里该卷的记录也一并清掉，防止下次进后台补传时"复活" */
  var rest=localCache().filter(function(r){return !bad(r)});
  if(rest.length!==localCache().length)saveLocalCache(rest);
  fetchSubs().then(function(recs){
    if(recs==null)return cb(0);
    var keep=recs.filter(function(r){return !bad(r)});
    var n=recs.length-keep.length;
    CLOUD=keep;
    if(!n)return cb(0);
    putSubs(keep).then(function(ok){cb(ok?n:0)});
  });
}

function qpaste(e,i){
  var items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  var f=null;
  for(var k=0;k<items.length;k++){
    if(items[k].type&&items[k].type.indexOf("image")===0){f=items[k].getAsFile();break}
  }
  if(!f)return;
  e.preventDefault();
  compressImg(f,function(dataUrl){
    if(!dataUrl){alert("图片处理失败，请重试");return}
    var name="q-"+Date.now()+"-"+Math.floor(Math.random()*900+100)+".jpg";
    EDIT.questions[i]._imgBusy=true;updQList();

      EDIT.questions[i]._imgBusy=false;
      if(ok)EDIT.questions[i].img=name;
      else alert("图片上传失败（网络问题），请重试");
      updQList();
    });
  });
}

function uploadQImg(i,el){
  var f=el.files&&el.files[0];
  el.value="";
  if(!f)return;
  if(!/^image\//.test(f.type)){alert("请选择图片文件");return}
  if(f.size>8*1024*1024){alert("图片太大（超过 8MB），请换一张小的");return}
  compressImg(f,function(dataUrl){
    if(!dataUrl){alert("图片处理失败，请换一张试试");return}
    var name="q-"+Date.now()+"-"+Math.floor(Math.random()*900+100)+".jpg";

      updQList();
    });
  });

function compressImg(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb(null)};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null)};
    img.onload=function(){
      try{
        var MAX=1280,w=img.width,h=img.height;
        if(!w||!h){cb(null);return}
        if(w>MAX||h>MAX){var k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
        var c=document.createElement("canvas");c.width=w;c.height=h;
        var ctx=c.getContext("2d");
        ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        cb(c.toDataURL("image/jpeg",0.75));
      }catch(e){cb(null)}
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function uploadImgToCloud(name,dataUrl,cb){
  var b64=dataUrl.split(",")[1];
  if(!b64){cb(null);return}
  var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},20000);
  fetch(GH+"/contents/img/"+name,{method:"PUT",headers:ghH(),
    body:JSON.stringify({message:"add question image",branch:"main",content:b64}),signal:ctl?ctl.signal:undefined})
    .then(function(r){clearTimeout(to);cb(r.ok?name:null)})
    .catch(function(){clearTimeout(to);cb(null)});
}

/* ================= 成绩 ================= */
function syncTip(t){document.getElementById("syncTip").textContent=t}
/* ================= 成绩同步（单文件方案） =================
   所有答卷存在 data/subs.json 一个数组里：
   - 读 = 1 个请求（旧方案是"列目录 + 每份答卷各拉一次"N+1 个请求，慢且容易卡死）
   - 写 = 读取现有数组 → 按 时间+姓名 去重合并 → PUT 回去
   - 8 秒超时兜底，提示状态永远不会卡死 */
var SUBS_PATH=GH+"/contents/data/subs.json";
function parseGHJson(d){
  try{return JSON.parse(decodeURIComponent(escape(atob(d.content))))}catch(e){return null}
}
function fetchSubs(){
  /* 成功 resolve(recs数组)；失败 resolve(null)。404 = 还没有任何成绩，视为空数组。
     三通道兜底：GitHub API → raw → jsdelivr CDN（api.github.com 在部分网络下不稳，
     raw/jsdelivr 通常可达；写只能走 API，读必须保证通） */
  function viaApi(ok,cacheHit){
    var done=false;
    var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
    var to=setTimeout(function(){if(!done){done=true;if(ctl)ctl.abort();viaRaw(ok,cacheHit)}},6000);
    fetch(SUBS_PATH+"?t="+Date.now(),{headers:ghH(),signal:ctl?ctl.signal:undefined})
      .then(function(r){
        if(r.status===404){if(!done){done=true;clearTimeout(to);ok([])}return null}
        if(!r.ok)throw new Error("HTTP "+r.status);
        return r.json();
      })
      .then(function(d){
        if(d===null||done)return;
        done=true;clearTimeout(to);
        var j=parseGHJson(d);ok(Array.isArray(j)?j:[]);
      })
      .catch(function(e){
        if(done||e==="silent")return;
        done=true;clearTimeout(to);viaRaw(ok,cacheHit);
      });
  }
  function viaRaw(ok,cacheHit){
    fetch(RAW+"/data/subs.json?t="+Date.now())
      .then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(j){ok(Array.isArray(j)?j:[])}).catch(function(){viaCdn(ok,cacheHit)});
  }
  function viaCdn(ok,cacheHit){
    fetch("https://cdn.jsdelivr.net/gh/phgithum/cloud-db@main/data/subs.json?t="+Date.now())
      .then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(j){ok(Array.isArray(j)?j:[])}).catch(function(){ok(null)});
  }
  return new Promise(function(resolve){
    viaApi(function(recs){resolve(recs)});
  });
}
function pushSubs(recs){
  /* 把若干条记录合并进云端 subs.json：读现值 → 去重合并 → PUT。
     读和写都有 8 秒超时——之前写请求挂起会导致整个同步回调永不执行（"一直同步中"的根因） */
  return fetchSubs().then(function(cur){
    if(cur==null)cur=[];
    var map={};
    cur.concat(recs).forEach(function(r){map[r.ts+"_"+normName(r.name)]=r});
    var merged=Object.keys(map).map(function(k){return map[k]});
    return new Promise(function(resolve){
      var done=false;
      var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
      var to=setTimeout(function(){if(!done){done=true;resolve(false)}},8000);
      fetch(SUBS_PATH+"?t="+Date.now(),{headers:ghH(),signal:ctl?ctl.signal:undefined})
        .then(function(r){return r.ok?r.json():null})
        .then(function(info){
          if(done)return;
          var body={message:"subs update",branch:"main",
            content:btoa(unescape(encodeURIComponent(JSON.stringify(merged))))};
          if(info&&info.sha)body.sha=info.sha;

            .then(function(r){if(!done){done=true;clearTimeout(to);resolve(r.ok)}});

function uploadSub(rec){return pushSubs([rec])}
function putSubs(recs){
  /* 覆盖写：直接用 recs 替换云端 subs.json，不与现值合并。
     删除场景必须用它——pushSubs 的"读现值→合并"会把刚删掉的记录加回去（复活 bug） */
  return new Promise(function(resolve){
    var done=false;
    var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
    var to=setTimeout(function(){if(!done){done=true;resolve(false)}},8000);
    fetch(SUBS_PATH+"?t="+Date.now(),{headers:ghH(),signal:ctl?ctl.signal:undefined})
      .then(function(r){return r.ok?r.json():null})
      .then(function(info){
        if(done)return;
        var body={message:"subs update",branch:"main",
          content:btoa(unescape(encodeURIComponent(JSON.stringify(recs))))};
        if(info&&info.sha)body.sha=info.sha;
        return fetch(SUBS_PATH,{method:"PUT",headers:ghH(),body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
          .then(function(r){if(!done){done=true;clearTimeout(to);resolve(r.ok)}});
      })
      .catch(function(){if(!done){done=true;clearTimeout(to);resolve(false)}});
  });
}
function allRecs(cb){
  /* 终极兜底：不管内部发生什么，20 秒后必须出结果，同步提示不可能永远卡住 */
  var called=false;
  function once(v){if(called)return;called=true;cb(v)}
  setTimeout(function(){once(CLOUD||[])},20000);
  fetchSubs().then(function(recs){
    if(recs)CLOUD=recs;
    var pend=localCache();
    if(pend.length){
      pushSubs(pend).then(function(ok){
        if(ok)saveLocalCache([]);
        once(CLOUD);
      });
    }else once(CLOUD);
  });
}

function mergedRecs(){

            if(p.indexOf("其他：")===0&&p.length>3)h+='<div style="font-size:12px;color:#33415e;margin-top:4px">· '+esc(p.slice(3))+' <span style="color:#99a">—— '+esc(a.who)+'</span></div>';
          });
        });
      }
      h+='</div>';
    });
  }
  box.innerHTML=h;
}
function scoreFilterView(){
  var all=visibleRecs(),f=SCORE_VIEW||document.getElementById("paperFilter").value;
  var view=f?all.filter(function(r){return r.paperTitle===f}):all;
  var v=document.getElementById("scoreBelow").value;
  if(v!==""&&!isNaN(+v))view=view.filter(function(r){return r.score<+v});
  return view;
}
function exportWrong(){
  var view=scoreFilterView();
  if(!view.length){alert("暂无符合筛选条件的记录可导出");return}
  var qs={};
  view.forEach(function(r){ r.detail.forEach(function(d){
    if(!d.q||d.survey)return;
    var k=(r.paperTitle||"未知试卷")+"||"+(d.q||"");
    qs[k]=qs[k]||{paper:r.paperTitle||"未知试卷",q:d.q,ok:0,n:0,who:[]};
    qs[k].n++; if(d.ok)qs[k].ok++; else qs[k].who.push(r.name);
  })});
  var rows=[["试卷","题号","题目","作答人数","答对人数","正确率","答错学生"]];
  var idx={};
  Object.keys(qs).forEach(function(k){
    var x=qs[k]; if(!x.q)return;
    idx[x.paper]=idx[x.paper]||0; idx[x.paper]++;
    rows.push([x.paper,"第"+idx[x.paper]+"题",x.q,x.n,x.ok,Math.round(x.ok/x.n*100)+"%",x.who.join("、")]);
  });
  if(rows.length===1){alert("这批答卷是旧版本提交的（无逐题详情），无法导出错题；升级后新提交的答卷可以导出");return}
  dlCSV(rows,"错题分析");
}
function exportCSV(){
  var view=scoreFilterView();
  if(!view.length){alert("暂无符合筛选条件的记录可导出");return}
  var maxN=Math.max.apply(null,view.map(function(r){return r.detail.length}));
  var rows=[["姓名","试卷","提交时间","总分","合格判定"]];
  for(var i=0;i<maxN;i++)rows[0].push("第"+(i+1)+"题");
  view.forEach(function(r){
    rows.push([r.name,r.paperTitle||"",r.time,r.score,r.score>=60?"合格":"不合格"].concat(
      r.detail.map(function(d){
        return Array.isArray(d.my)?(d.my.length?d.my.map(function(v){return "ABCD"[v]}).join(""):"未答"):(d.my<0?"未答":"ABCD"[d.my]);
      })));
  });
  dlCSV(rows,"答卷记录");
}
function dlCSV(rows,prefix){
  var csv="\uFEFF"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=prefix+"_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
}

/* ================= 专属链接锁死 ================= */
function forceExit(msg){
  stopPollStop();
  document.querySelectorAll(".page").forEach(function(p){p.classList.add("hide")});
  var d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;background:#f2f4f8;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px";
  d.innerHTML='<div style="background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:38px 30px;width:320px;max-width:100%;text-align:center;box-shadow:0 4px 18px rgba(20,30,60,.08)">'+
    '<div style="font-size:40px">🔒</div>'+
    '<div style="font-size:16px;font-weight:600;margin:14px 0 8px">无法继续</div>'+
    '<div style="font-size:13px;color:#7b8496;line-height:1.9">'+msg+'</div></div>';
  document.body.appendChild(d);
}

/* ================= 切屏检测 =================
   答题期间：切到别的软件 / 最小化 / 切标签页 → 记一次并提醒；
   超过试卷设置的上限 → 锁定，显示"无法答题"。
   老师后台不设置（0）则完全不启用。 */
var SW={count:0,limit:0,last:0,active:false,pending:0};
function swStart(limit){
  SW.count=0;SW.limit=Math.max(0,limit|0);SW.pending=0;
  SW.last=Date.now();   /* 开考给 1.5 秒缓冲，开考提示等弹窗的失焦不计入 */
  SW.active=SW.limit>0;
}
function swHit(){
  if(!SW.active||!document.getElementById("pgQuiz")||document.getElementById("pgQuiz").classList.contains("hide"))return;
  var now=Date.now();
  if(now-SW.last<1500)return;   /* blur + visibilitychange 会连着触发，1.5 秒内只记一次 */
  SW.last=now;SW.count++;SW.pending++;
}
function swReport(){
  if(!SW.active||!SW.pending)return;
  var p=SW.pending;SW.pending=0;
  var left=SW.limit-SW.count;
  if(left<=0){swLock();return}
  SW.active=false;   /* 弹窗本身会让窗口失焦，先暂停检测防误计 */
  alert("⚠ 检测到切出答题页面 "+p+" 次！\n\n已累计 "+SW.count+" / "+SW.limit+" 次，还剩 "+left+" 次机会。\n请专心作答，超过上限将无法继续答题。");
  SW.active=true;
}
function swLock(){
  swStop();
  forceExit("检测到多次切出答题页面（累计 "+SW.count+" 次，上限 "+SW.limit+" 次）。<br>本次考试已被锁定，无法继续答题和提交。<br>如遇特殊情况，请联系老师说明。");
}
function swStop(){SW.active=false;SW.pending=0}
window.addEventListener("blur",swHit);
document.addEventListener("visibilitychange",function(){
  if(document.hidden)swHit();else swReport();   /* 回到页面时弹出提醒 */
});
window.addEventListener("focus",swReport);

/* ================= 考试限时 =================
   开考起倒计时（截止时间存本机，刷新/切屏时间照走，防重进续命），
   时间一到自动交卷。老师设 0 则不限时。 */
var TIMER={end:0,int:0,sent:false};
function examTimerStart(){
  var min=parseInt(CUR.limitMin,10)||0;
  if(!min)return;
  var k="quiz_dl_"+CUR.id+"_"+studentName;
  var end=parseInt(localStorage.getItem(k),10)||0;
  /* 没存过 / 已严重过期（超过1天）→ 全新开考；否则沿用旧截止，刷新重进不加时 */
  if(!end||end<Date.now()-86400000){end=Date.now()+min*60000}
  localStorage.setItem(k,end);
  TIMER.end=end;TIMER.sent=false;
  var bar=document.createElement("div");
  bar.id="examTimer";
  bar.style.cssText="position:sticky;top:0;z-index:9;background:#fff;border:1px solid #e4e8f0;border-radius:8px;padding:9px 12px;font-weight:600;color:#2456c4;text-align:center;margin-bottom:12px;font-variant-numeric:tabular-nums";
  document.getElementById("pgQuiz").insertBefore(bar,document.getElementById("quizCard"));
  TIMER.int=setInterval(tickTimer,500);tickTimer();
}
function tickTimer(){
  var el=document.getElementById("examTimer");
  if(!el){clearInterval(TIMER.int);return}
  var left=Math.max(0,TIMER.end-Date.now());
  var m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  el.textContent="剩余时间："+m+" 分 "+(s<10?"0":"")+s+" 秒";
  if(left<=60000)el.style.color="#d93a3a";
  if(left<=0&&!TIMER.sent){
    clearInterval(TIMER.int);
    el.textContent="时间到，正在自动交卷…";
    submitQuiz(true);
  }
}
function examTimerStop(){
  clearInterval(TIMER.int);
  if(CUR&&studentName)localStorage.removeItem("quiz_dl_"+CUR.id+"_"+studentName);
}
/* ===== 考试停止轮询：答题中每 60 秒检查一次试卷是否被老师停止 =====
   走 raw 通道（不占 GitHub API 配额），raw 有约 5 分钟 CDN 缓存，
   所以从老师点"停止"到学生被收卷，延迟 1～5 分钟。 */
var STOP_POLL=null;
function stopPollStart(){
  stopPollStop();
  STOP_POLL=setInterval(function(){
    if(!CUR)return;
    fetch(RAW+"/exam/papers.json?t="+Date.now())
      .then(function(r){return r.ok?r.json():null})
      .then(function(j){
        if(!Array.isArray(j)||!CUR)return;
        var p=j.filter(function(x){return x.id===CUR.id})[0];
        if(p&&p.stopped){
          stopPollStop();
          alert("老师已停止这场考试，现在自动交卷。已答的题目会正常保存成绩。");
          CUR.stopped=true;
          submitQuiz(true);
        }
      }).catch(function(){});
  },60000);
}
function stopPollStop(){if(STOP_POLL){clearInterval(STOP_POLL);STOP_POLL=null}}
/* ================= 启动 ================= */
document.getElementById("pwdInput").addEventListener("keydown",function(e){if(e.key==="Enter")adminLogin()});
document.getElementById("nameInput").addEventListener("keydown",function(e){if(e.key==="Enter")startExam()});
loadPapers(function(list){
  PAPERS=list;renderHome();
  /* 专属考试链接：?exam=卷子码 → 直接进入该卷 */
  var m=location.search.match(/[?&]exam=([A-Za-z0-9]+)/);
  if(m){
    DIRECT=true;
    var dp=PAPERS.filter(function(x){return (x.code||x.id)===m[1]})[0];
    if(!dp){forceExit("考试链接无效或该考试已删除。<br>请联系老师获取新的考试链接。");return}
    if(pState(dp)==="over"){forceExit("该考试已于 "+fmtT(dp.closeT)+" 结束，不能再进入。");return}
    openPaper(dp.id);
  }
});
