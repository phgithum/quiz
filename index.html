<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>在线考试系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.page{max-width:540px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fff;border-radius:12px;padding:20px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px}
h1{font-size:20px;text-align:center;margin:26px 0 6px}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:22px}
label{display:block;font-size:14px;color:#555;margin:10px 0 6px}
label:first-child{margin-top:0}
input[type=text],input[type=datetime-local],input[type=number],select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;outline:none;background:#fff;font-family:inherit}
textarea{min-height:64px;resize:vertical;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:#4a7cf7}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:17px;font-weight:600;background:#4a7cf7;color:#fff;margin-top:16px;cursor:pointer}
.btn:active{opacity:.85}
.btn.gray{background:#eee;color:#666}
.btn.green{background:#18a058}
.btn.small{width:auto;display:inline-block;padding:8px 16px;font-size:13px;margin-top:0}
.btn:disabled{opacity:.5}
.paper{border:1px solid #e3e6ee;border-radius:12px;padding:16px;margin-bottom:12px;background:#fff;cursor:pointer;transition:border .15s}
.paper:active{border-color:#4a7cf7}
.paper .pt{font-size:16px;font-weight:600;margin-bottom:6px}
.paper .pm{font-size:13px;color:#888;line-height:1.7}
.st{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;margin-left:8px;vertical-align:2px}
.st.ing{background:#e6f7ec;color:#18a058}
.st.early{background:#fff7e0;color:#c78a00}
.st.over{background:#f2f2f2;color:#999}
.q-tit{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:12px}
.q-num{display:inline-block;background:#4a7cf7;color:#fff;font-size:12px;border-radius:6px;padding:2px 8px;margin-right:8px;vertical-align:2px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid #e3e6ee;border-radius:10px;padding:12px;margin-bottom:10px;font-size:15px;line-height:1.5;cursor:pointer;transition:all .15s}
.opt .tag{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:13px;color:#666}
.opt.sel{border-color:#4a7cf7;background:#eef4ff}
.opt.sel .tag{background:#4a7cf7;border-color:#4a7cf7;color:#fff}
.score{font-size:44px;font-weight:700;color:#4a7cf7}
.pass{display:inline-block;margin-top:8px;padding:4px 16px;border-radius:20px;font-size:14px;font-weight:600}
.pass.y{background:#e6f7ec;color:#18a058}
.pass.n{background:#fdeaea;color:#d93535}
.ans-item{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.5}
.ans-item:last-child{border-bottom:none}
.ans-item .ok{color:#18a058;font-weight:600;flex:none}
.ans-item .no{color:#d93535;font-weight:600;flex:none}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{border:1px solid #e3e6ee;padding:6px 4px;text-align:center;word-break:break-all}
th{background:#f7f9fc}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.row .btn{margin-top:0}
.muted{color:#999;font-size:12px;text-align:center;margin-top:10px}
.tip{color:#4a7cf7;font-size:13px}
.warn{color:#d93535;font-size:13px}
.link{color:#4a7cf7;font-size:13px;text-align:center;margin-top:18px;cursor:pointer;text-decoration:underline}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs .btn{margin-top:0}
.qedit{border:1px solid #e3e6ee;border-radius:10px;padding:12px;margin-bottom:12px;background:#fafbfd}
.qedit .del{color:#d93535;font-size:12px;cursor:pointer;text-decoration:underline;float:right}
.optrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.optrow input[type=text]{flex:1;padding:8px;font-size:14px}
.optrow .ck{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;color:#18a058}
.info-box{background:#eef4ff;border-radius:10px;padding:12px;font-size:13px;color:#4a7cf7;line-height:1.7}
.hide{display:none}
</style>
</head>
<body>

<!-- 首页：卷子列表 -->
<div id="pgHome" class="page">
  <h1>在线考试</h1>
  <div class="sub">选择一张卷子开始答题</div>
  <div id="paperList"></div>
  <div class="link" onclick="showAdmin()">后台管理</div>
</div>

<!-- 输入姓名 -->
<div id="pgName" class="page hide">
  <h1 id="pTitle">考试</h1>
  <div class="sub" id="pMeta"></div>
  <div class="card">
    <div class="info-box" id="pInfo"></div>
    <label style="margin-top:14px">请输入编号 / 姓名</label>
    <input type="text" id="nameInput" placeholder="输入你的编号或姓名" maxlength="20">
    <button class="btn" id="startBtn" onclick="startExam()">开始答题</button>
  </div>
  <div class="link" onclick="backHome()">返回选择卷子</div>
</div>

<!-- 答题页 -->
<div id="pgQuiz" class="page hide">
  <div class="card" id="quizCard"></div>
  <button class="btn" id="subBtn" onclick="submitQuiz()">提交答卷</button>
</div>

<!-- 成绩页 -->
<div id="pgResult" class="page hide">
  <div class="card" style="text-align:center" id="resHead"></div>
  <div class="card" id="resDetail"></div>
  <button class="btn gray" onclick="backHome()">返回首页</button>
</div>

<!-- 后台登录 -->
<div id="pgAdminLogin" class="page hide">
  <h1>后台管理</h1>
  <div class="sub">请使用聚合后台账户登录</div>
  <div class="card">
    <label>账户（超管填 panhao）</label>
    <input type="text" id="userInput" placeholder="账户名">
    <label>密码</label>
    <input type="text" id="pwdInput" placeholder="密码">
    <button class="btn" onclick="adminLogin()">进入后台</button>
  </div>
  <div class="link" onclick="backHome()">返回首页</div>
</div>

<!-- 后台 -->
<div id="pgAdmin" class="page hide">
  <h1>考试后台</h1>
  <div class="sub" id="whoBar"></div>
  <div class="tabs">
    <button class="btn small" id="tabB1" onclick="switchTab(0)">试卷管理</button>
    <button class="btn small gray" id="tabB2" onclick="switchTab(1)">成绩查询</button>
  </div>

  <!-- 试卷列表 -->
  <div id="tabPapers">
    <div class="card">
      <div class="row"><button class="btn small green" onclick="editPaper(null)">＋ 新建试卷</button>
      <button class="btn small" onclick="loadPapers(true)">刷新</button></div>
      <div class="tip" id="papersTip" style="margin-top:10px"></div>
    </div>
    <div id="paperAdminList"></div>
  </div>

  <!-- 试卷编辑 -->
  <div id="tabEdit" class="hide">
    <div class="card">
      <label>试卷标题</label>
      <input type="text" id="cfgTitle" placeholder="例如：高数第一章测验">
      <label>开始时间（不填=立即开始）</label>
      <input type="datetime-local" id="cfgOpen">
      <label>结束时间（不填=不限制）</label>
      <input type="datetime-local" id="cfgClose">
      <label>每人最多答题次数</label>
      <input type="number" id="cfgTries" min="1" max="99" value="1">
      <label>合格分数线（0-100）</label>
      <input type="number" id="cfgPass" min="0" max="100" value="60">
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px">题目编辑（<span id="qCount">0</span> 题，每题分值 = 100÷题数）</div>
      <div id="qList"></div>
      <div class="row">
        <button class="btn small" onclick="addQ('single')">＋单选题</button>
        <button class="btn small" onclick="addQ('multi')">＋多选题</button>
        <button class="btn small" onclick="addQ('judge')">＋判断题</button>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <button class="btn small green" id="saveCfgBtn" onclick="savePaper()">保存并发布</button>
        <button class="btn small gray" onclick="cancelEdit()">放弃修改</button>
      </div>
      <div class="tip" id="cfgTip" style="margin-top:10px"></div>
    </div>
  </div>

  <!-- 成绩查询 -->
  <div id="tabScore" class="hide">
    <div class="card">
      <div>云端共 <b id="subCount">0</b> 份答卷　<span class="tip" id="syncTip"></span></div>
      <label>按试卷筛选</label>
      <select id="paperFilter" onchange="renderAdmin()"><option value="">全部试卷</option></select>
      <div class="row">
        <button class="btn small" style="background:#18a058" onclick="exportCSV()">导出Excel(CSV)</button>
        <button class="btn small" onclick="loadSubs(true)">刷新数据</button>
        <button class="btn small gray" onclick="clearAll()">清空记录</button>
      </div>
    </div>
    <div class="card" id="adminList"></div>
  </div>
  <div class="link" onclick="backHome()">返回首页</div>
</div>

<script>
/* ================= 云端（统一库 cloud-db） ================= */
var TOK1="ghp_MjkBxQwkydhgmw7TxpItxQrNhtXKsO1sA",TOK2="wRS";
var GH="https://api.github.com/repos/phgithum/cloud-db";
var RAW="https://raw.githubusercontent.com/phgithum/cloud-db/main";
function ghH(){return{"Authorization":"Bearer "+TOK1+TOK2,"Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"quiz-h5"}}

/* ================= 状态 ================= */
var PAPERS=[],EDIT=null,answers=[],studentName="",CUR=null,CLOUD=[];
function localCache(){try{return JSON.parse(localStorage.getItem("quiz_subs")||"[]")}catch(e){return[]}}
function saveLocalCache(a){try{localStorage.setItem("quiz_subs",JSON.stringify(a))}catch(e){}}
function show(id){["pgHome","pgName","pgQuiz","pgResult","pgAdminLogin","pgAdmin"].forEach(function(p){document.getElementById(p).classList.add("hide")});document.getElementById(id).classList.remove("hide");window.scrollTo(0,0)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var TYPE_NAME={single:"单选",multi:"多选",judge:"判断"};

/* ================= 试卷读写 ================= */
function loadPapers(cb){
  var urls=[RAW+"/exam/papers.json?t="+Date.now(),
            "https://cdn.jsdelivr.net/gh/phgithum/cloud-db@main/exam/papers.json"];
  (function tryOne(i){
    if(i>=urls.length){cb([]);return}
    fetch(urls[i]).then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(j){cb(Array.isArray(j)?j:[])}).catch(function(){tryOne(i+1)});
  })(0);
}
function savePapers(list,tipEl,okTxt){
  if(tipEl)tipEl.textContent="保存中…";
  return fetch(GH+"/contents/exam/papers.json",{method:"PUT",headers:ghH(),
    body:JSON.stringify({message:"papers update",branch:"main",
      content:btoa(unescape(encodeURIComponent(JSON.stringify(list))))})
  }).then(function(r){
    if(tipEl)tipEl.textContent=r.ok?(okTxt||"✔ 已发布，1分钟内全场生效"):"✘ 保存失败 HTTP "+r.status;
    return r.ok;
  }).catch(function(){if(tipEl)tipEl.textContent="✘ 网络失败，请重试";return false});
}
function pState(p){
  var now=Date.now();
  if(p.openT&&now<new Date(p.openT).getTime())return"early";
  if(p.closeT&&now>new Date(p.closeT).getTime())return"over";
  return"ing";
}
var ST_TXT={ing:"进行中",early:"未开始",over:"已结束"};
function fmtT(t){if(!t)return"";return new Date(t).toLocaleString("zh-CN",{hour12:false})}
function qTypeSummary(qs){
  var c={};qs.forEach(function(q){c[q.type]=(c[q.type]||0)+1});
  return Object.keys(c).map(function(k){return TYPE_NAME[k]+"×"+c[k]}).join(" / ");
}

/* ================= 首页 ================= */
function renderHome(){
  var h="";
  if(!PAPERS.length)h='<div class="card"><div class="muted" style="padding:16px">暂无考试，请等老师发布</div></div>';
  PAPERS.forEach(function(p){
    var st=pState(p);
    h+='<div class="paper" onclick="openPaper(\''+p.id+'\')">'+
       '<div class="pt">'+esc(p.title)+'<span class="st '+st+'">'+ST_TXT[st]+'</span></div>'+
       '<div class="pm">'+qTypeSummary(p.questions)+'　共 '+p.questions.length+' 题　满分 100<br>'+
       (p.closeT?'截止：<b>'+fmtT(p.closeT)+'</b>　':'')+'每人 '+(p.tries||1)+' 次　合格 '+(p.passLine!=null?p.passLine:60)+' 分</div></div>';
  });
  document.getElementById("paperList").innerHTML=h;
}
function openPaper(id){
  var p=PAPERS.filter(function(x){return x.id===id})[0];
  if(!p)return;
  CUR=p;
  document.getElementById("pTitle").textContent=p.title;
  document.getElementById("pMeta").textContent=qTypeSummary(p.questions)+"　共 "+p.questions.length+" 题　满分 100";
  var info=["每人可答：<b>"+(p.tries||1)+"</b> 次　合格线："+(p.passLine!=null?p.passLine:60)+" 分"];
  if(p.openT)info.push("开始："+fmtT(p.openT));
  if(p.closeT)info.push('截止：<b>'+fmtT(p.closeT)+'</b>');
  var st=pState(p);
  if(st==="early")info.push('<span class="warn">⚠ 考试尚未开始，到点才能进</span>');
  if(st==="over")info.push('<span class="warn">⚠ 考试已结束</span>');
  document.getElementById("pInfo").innerHTML=info.join("<br>");
  document.getElementById("nameInput").value="";
  show("pgName");
}
function startExam(){
  var n=document.getElementById("nameInput").value.trim();
  if(!n){alert("请输入编号或姓名");return}
  var st=pState(CUR);
  if(st==="early"){alert("考试尚未开始，请等到 "+fmtT(CUR.openT));return}
  document.getElementById("startBtn").disabled=true;document.getElementById("startBtn").textContent="检查答题次数…";
  countAttempts(n,CUR.id,function(used){
    document.getElementById("startBtn").disabled=false;document.getElementById("startBtn").textContent="开始答题";
    if(st!=="over"&&used>=(CUR.tries||1)){alert("这张卷子你已答满 "+(CUR.tries||1)+" 次，不能再答了");return}
    studentName=n;answers=CUR.questions.map(function(q){return q.type==="multi"?[]:-1});
    renderQuiz();show("pgQuiz");
  });
}
function countAttempts(name,pid,cb){
  allRecs(function(recs){
    cb(recs.filter(function(r){return r.name===name&&r.paperId===pid}).length);
  });
}

/* ================= 答题 ================= */
function renderQuiz(){
  var h="";
  CUR.questions.forEach(function(q,i){
    h+='<div style="margin-bottom:22px"><div class="q-tit"><span class="q-num">'+(i+1)+'</span>【'+TYPE_NAME[q.type]+'】'+esc(q.q)+'</div>';
    q.opts.forEach(function(o,j){
      var sel=Array.isArray(answers[i])?answers[i].indexOf(j)>=0:answers[i]===j;
      h+='<div class="opt'+(sel?' sel':'')+'" onclick="pick('+i+','+j+')"><span class="tag">'+"ABCD"[j]+'</span><span>'+esc(o)+'</span></div>';
    });
    h+='</div>';
  });
  var done=answers.filter(function(a){return Array.isArray(a)?a.length:(a>=0)}).length;
  h+='<div class="muted">已答 '+done+' / '+CUR.questions.length+' 题</div>';
  document.getElementById("quizCard").innerHTML=h;
}
function pick(i,j){
  if(CUR.questions[i].type==="multi"){
    var k=answers[i].indexOf(j);
    if(k>=0)answers[i].splice(k,1);else answers[i].push(j);
    answers[i].sort();
  }else answers[i]=j;
  renderQuiz();
}
function submitQuiz(){
  var un=answers.filter(function(a){return Array.isArray(a)?!a.length:a<0}).length;
  if(un>0&&!confirm("还有 "+un+" 题没答，确定提交吗？"))return;
  var per=100/CUR.questions.length,score=0,detail=[];
  CUR.questions.forEach(function(q,i){
    var my=Array.isArray(answers[i])?answers[i].slice():answers[i];
    var ok=Array.isArray(my)?(my.length===q.ans.length&&my.every(function(v,k){return v===q.ans[k]})):my===q.ans[0];
    if(ok)score+=per;
    detail.push({ok:ok,my:my});
  });
  score=Math.round(score*10)/10;
  var rec={name:studentName,paperId:CUR.id,paperTitle:CUR.title,time:new Date().toLocaleString("zh-CN",{hour12:false}),ts:Date.now(),score:score,detail:detail};
  var b=document.getElementById("subBtn");b.disabled=true;b.textContent="提交中…";
  uploadSub(rec).then(function(ok){
    b.disabled=false;b.textContent="提交答卷";
    if(!ok){var c=localCache();c.push(rec);saveLocalCache(c)}
    renderResult(rec);show("pgResult");
  });
}
function uploadSub(rec){
  var path="data/"+rec.ts+"_"+Math.random().toString(36).slice(2,8)+".json";
  return fetch(GH+"/contents/"+path,{method:"PUT",headers:ghH(),
    body:JSON.stringify({message:"quiz: "+rec.name,branch:"main",
      content:btoa(unescape(encodeURIComponent(JSON.stringify(rec))))})
  }).then(function(r){return r.ok}).catch(function(){return false});
}
function renderResult(rec){
  var pl=(CUR.passLine!=null?CUR.passLine:60),pass=rec.score>=pl;
  document.getElementById("resHead").innerHTML=
    '<div style="font-size:15px;color:#666">'+esc(rec.paperTitle)+' · '+esc(rec.name)+'</div>'+
    '<div class="score">'+rec.score+'</div><div style="font-size:13px;color:#999">满分 100</div>'+
    '<div class="pass '+(pass?'y':'n')+'">'+(pass?'✔ 合格':'✘ 不合格')+'（分数线 '+pl+' 分）</div>';
  var h="";
  CUR.questions.forEach(function(q,i){
    var d=rec.detail[i];
    var myTxt=Array.isArray(d.my)?(d.my.length?d.my.map(function(v){return "ABCD"[v]}).join(""):"未作答"):(d.my<0?"未作答":"ABCD"[d.my]);
    var okTxt=q.ans.map(function(v){return "ABCD"[v]}).join("");
    h+='<div class="ans-item"><span class="'+(d.ok?'ok':'no')+'">'+(d.ok?'✔':'✘')+'</span>'+
       '<span><b>'+(i+1)+'.</b> 【'+TYPE_NAME[q.type]+'】'+esc(q.q)+'<br>你的答案：<b style="color:'+(d.ok?'#18a058':'#d93535')+'">'+myTxt+'</b>'+
       (d.ok?'':'　正确答案：<b style="color:#18a058">'+okTxt+'</b>')+'</span></div>';
  });
  document.getElementById("resDetail").innerHTML=h;
}
function backHome(){renderHome();show("pgHome");if(sessionStorage.getItem("quiz_admin"))refreshAfterHome()}

/* ================= 登录 ================= */
function showAdmin(){
  if(sessionStorage.getItem("quiz_admin")==="1"){enterAdmin()}
  else{document.getElementById("userInput").value="";document.getElementById("pwdInput").value="";show("pgAdminLogin")}
}
function adminLogin(){
  var u=document.getElementById("userInput").value.trim(),p=document.getElementById("pwdInput").value;
  function pass(who){sessionStorage.setItem("quiz_admin","1");sessionStorage.setItem("quiz_admin_who",who);enterAdmin()}
  if(u==="panhao"&&p==="panhao123"){pass("超管 panhao");return}
  loadAccs(function(list){
    var hit=(list||[]).filter(function(a){return a.u===u&&a.p===p&&a.quiz})[0];
    if(hit)pass("账户 "+u);
    else alert("账户或密码错误（或无本系统权限）");
  });
}
function loadAccs(cb){
  var us=["https://phgithum.github.io/admin-console/accounts.json?t="+Date.now(),
          "https://raw.githubusercontent.com/phgithum/admin-console/main/accounts.json?t="+Date.now(),
          "https://cdn.jsdelivr.net/gh/phgithum/admin-console@main/accounts.json"];
  (function tryOne(i){
    if(i>=us.length){cb([]);return}
    fetch(us[i]).then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(j){cb(j||[])}).catch(function(){tryOne(i+1)});
  })(0);
}
function enterAdmin(){
  document.getElementById("whoBar").textContent="当前登录："+sessionStorage.getItem("quiz_admin_who");
  show("pgAdmin");switchTab(0);renderPaperAdmin();loadSubs(true);
}
function refreshAfterHome(){}
function switchTab(i){
  document.getElementById("tabPapers").classList.toggle("hide",i!==0);
  document.getElementById("tabEdit").classList.toggle("hide",i!==0);
  document.getElementById("tabScore").classList.toggle("hide",i!==1);
  document.getElementById("tabB1").className="btn small"+(i===0?"":" gray");
  document.getElementById("tabB2").className="btn small"+(i===1?"":" gray");
  if(i===0)renderPaperAdmin();
}

/* ================= 试卷管理 ================= */
function renderPaperAdmin(){
  var h="";
  if(!PAPERS.length)h='<div class="card"><div class="muted" style="padding:16px">还没有试卷，点上面「＋ 新建试卷」</div></div>';
  PAPERS.forEach(function(p){
    var st=pState(p);
    h+='<div class="paper" style="cursor:default"><div class="pt">'+esc(p.title)+'<span class="st '+st+'">'+ST_TXT[st]+'</span></div>'+
       '<div class="pm">'+qTypeSummary(p.questions)+'　'+p.questions.length+' 题　每人 '+(p.tries||1)+' 次　合格 '+(p.passLine!=null?p.passLine:60)+' 分'+
       (p.closeT?'　截止 '+fmtT(p.closeT):'')+'</div>'+
       '<div class="row"><button class="btn small" onclick="editPaper(\''+p.id+'\')">✎ 编辑</button>'+
       '<button class="btn small gray" onclick="dupPaper(\''+p.id+'\')">⧉ 复制</button>'+
       '<button class="btn small red" onclick="delPaper(\''+p.id+'\')">🗑 删除</button></div></div>';
  });
  document.getElementById("paperAdminList").innerHTML=h;
}
function editPaper(id){
  if(id){EDIT=JSON.parse(JSON.stringify(PAPERS.filter(function(x){return x.id===id})[0]))}
  else EDIT={id:"p"+Date.now(),title:"",openT:"",closeT:"",tries:1,passLine:60,questions:[]};
  loadCfgToForm();
  document.getElementById("tabEdit").classList.remove("hide");
  document.getElementById("tabPapers").classList.add("hide");
  document.getElementById("tabB1").className="btn small gray";
  window.scrollTo(0,0);
}
function cancelEdit(){document.getElementById("tabEdit").classList.add("hide");document.getElementById("tabPapers").classList.remove("hide");document.getElementById("tabB1").className="btn small";renderPaperAdmin()}
function dupPaper(id){
  var p=JSON.parse(JSON.stringify(PAPERS.filter(function(x){return x.id===id})[0]));
  p.id="p"+Date.now();p.title=p.title+"（副本）";
  PAPERS.push(p);savePapers(PAPERS,document.getElementById("papersTip"),"✔ 已复制").then(function(ok){if(ok){loadPapers(function(){renderPaperAdmin()})}});
}
function delPaper(id){
  var p=PAPERS.filter(function(x){return x.id===id})[0];
  if(!confirm("确定删除试卷「"+p.title+"」？（已交的答卷记录仍保留）"))return;
  PAPERS=PAPERS.filter(function(x){return x.id!==id});
  savePapers(PAPERS,document.getElementById("papersTip"),"✔ 已删除").then(function(ok){if(ok)renderPaperAdmin()});
}

/* ================= 题目编辑 ================= */
function blankQ(type){
  if(type==="judge")return{type:type,q:"",opts:["正确","错误"],ans:[0]};
  return{type:type,q:"",opts:["","","",""],ans:[]};
}
function updQList(){
  document.getElementById("qCount").textContent=EDIT.questions.length;
  var h="";
  EDIT.questions.forEach(function(q,i){
    h+='<div class="qedit"><span class="del" onclick="delQ('+i+')">删除</span>'+
       '<div style="font-size:12px;color:#888;margin-bottom:6px">第'+(i+1)+'题 · '+TYPE_NAME[q.type]+'（正确答案：<b style="color:#18a055">'+q.ans.map(function(v){return "ABCD"[v]}).join("")+'</b>）</div>'+
       '<textarea oninput="updQ('+i+',\'q\',this.value)" placeholder="题目内容">'+esc(q.q)+'</textarea>';
    q.opts.forEach(function(o,j){
      h+='<div class="optrow"><span class="ck"><input type="checkbox" '+(q.ans.indexOf(j)>=0?'checked':'')+' onchange="toggleAns('+i+','+j+',this.checked)">正确</span>'+
         '<input type="text" value="'+esc(o)+'" oninput="updQ('+i+',\'opt'+j+'\',this.value)"></div>';
    });
    h+='</div>';
  });
  document.getElementById("qList").innerHTML=h;
}
function loadCfgToForm(){
  document.getElementById("cfgTitle").value=EDIT.title||"";
  document.getElementById("cfgOpen").value=EDIT.openT||"";
  document.getElementById("cfgClose").value=EDIT.closeT||"";
  document.getElementById("cfgTries").value=EDIT.tries||1;
  document.getElementById("cfgPass").value=EDIT.passLine!=null?EDIT.passLine:60;
  updQList();
}
function addQ(t){EDIT.questions.push(blankQ(t));updQList()}
function delQ(i){if(!confirm("删除第"+(i+1)+"题？"))return;EDIT.questions.splice(i,1);updQList()}
function updQ(i,f,v){
  if(f==="q")EDIT.questions[i].q=v;
  else if(f.indexOf("opt")===0)EDIT.questions[i].opts[+f.slice(3)]=v;
}
function toggleAns(i,j,on){
  var q=EDIT.questions[i];
  if(q.type!=="multi"&&on)q.ans=[j];
  else{var k=q.ans.indexOf(j);if(on){if(k<0)q.ans.push(j)}else if(k>=0)q.ans.splice(k,1);q.ans.sort()}
  updQList();
}
function savePaper(){
  EDIT.title=document.getElementById("cfgTitle").value.trim()||"未命名试卷";
  EDIT.openT=document.getElementById("cfgOpen").value||"";
  EDIT.closeT=document.getElementById("cfgClose").value||"";
  EDIT.tries=Math.max(1,parseInt(document.getElementById("cfgTries").value,10)||1);
  EDIT.passLine=parseInt(document.getElementById("cfgPass").value,10);
  if(!EDIT.questions.length){alert("至少要有一道题");return}
  if(EDIT.questions.some(function(q){return !q.q.trim()})){alert("有题目没写内容");return}
  if(EDIT.questions.some(function(q){return !q.ans.length})){alert("有题目没勾选正确答案");return}
  EDIT.updated=new Date().toLocaleString("zh-CN",{hour12:false});
  var i=PAPERS.findIndex(function(x){return x.id===EDIT.id});
  if(i>=0)PAPERS[i]=EDIT;else PAPERS.push(EDIT);
  var b=document.getElementById("saveCfgBtn");b.disabled=true;b.textContent="发布中…";
  savePapers(PAPERS,document.getElementById("cfgTip"),"✔ 已发布，1分钟内全场生效").then(function(ok){
    b.disabled=false;b.textContent="保存并发布";
    if(ok){PAPERS.sort(function(a,b){return (b.ts||0)-(a.ts||0)});cancelEdit();renderHome()}
  });
}

/* ================= 成绩 ================= */
function syncTip(t){document.getElementById("syncTip").textContent=t}
function allRecs(cb){
  fetch(GH+"/contents/data?ref=main",{headers:ghH()}).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
  }).then(function(list){
    if(!Array.isArray(list))list=[];
    var jobs=list.filter(function(f){return /\.json$/.test(f.name)}).map(function(f){
      return fetch(f.url,{headers:ghH()}).then(function(r){return r.json()}).then(function(d){
        try{return JSON.parse(decodeURIComponent(escape(atob(d.content))))}catch(e){return null}
      }).catch(function(){return null});
    });
    return Promise.all(jobs);
  }).then(function(recs){
    var cloud=recs.filter(function(r){return r&&r.name});
    CLOUD=cloud;
    var pend=localCache();
    if(pend.length){
      Promise.all(pend.map(uploadSub)).then(function(oks){
        saveLocalCache(pend.filter(function(_,i){return !oks[i]}));
        if(oks.some(Boolean))setTimeout(function(){loadSubs(false)},1500);
      });
    }
    cb(cloud);
  }).catch(function(){cb(null)});
}
function mergedRecs(){
  var map={};
  (CLOUD||[]).forEach(function(r){map[r.ts+"_"+r.name]=r});
  localCache().forEach(function(r){if(!map[r.ts+"_"+r.name])map[r.ts+"_"+r.name]=r});
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.ts-a.ts});
}
function loadSubs(manual){
  syncTip("云端同步中…");
  allRecs(function(recs){
    if(recs){renderAdmin();syncTip("已同步 ✓")}
    else{renderAdmin();syncTip(manual?"云端拉取失败，显示本机缓存":"本机缓存")}
  });
}
function renderAdmin(){
  var all=mergedRecs();
  document.getElementById("subCount").textContent=all.length;
  // 试卷筛选下拉
  var sel=document.getElementById("paperFilter"),cur=sel.value;
  var titles=[];
  all.forEach(function(r){if(r.paperTitle&&titles.indexOf(r.paperTitle)<0)titles.push(r.paperTitle)});
  sel.innerHTML='<option value="">全部试卷</option>'+titles.map(function(t){return '<option value="'+esc(t)+'"'+(t===cur?' selected':'')+'>'+esc(t)+'</option>'}).join("");
  var f=sel.value;
  var view=f?all.filter(function(r){return r.paperTitle===f}):all;
  var pl=(f?(PAPERS.filter(function(p){return p.title===f})[0]||{}).passLine:null);
  if(pl==null)pl=60;
  if(!view.length){document.getElementById("adminList").innerHTML='<div class="muted" style="padding:20px">暂无答卷记录</div>';return}
  var h='<table><tr><th>姓名</th><th>试卷</th><th>提交时间</th><th>得分</th><th>判定</th><th>每题作答</th></tr>';
  view.forEach(function(r){
    var det=r.detail.map(function(d,i){
      var my=Array.isArray(d.my)?(d.my.length?d.my.map(function(v){return "ABCD"[v]}).join(""):"-"):(d.my<0?"-":"ABCD"[d.my]);
      return (i+1)+":"+my+(d.ok?"√":"×");
    }).join(" ");
    h+='<tr><td>'+esc(r.name)+'</td><td>'+esc(r.paperTitle||"")+'</td><td>'+esc(r.time||"")+'</td><td><b>'+r.score+'</b></td>'+
       '<td style="color:'+(r.score>=pl?'#18a058':'#d93535')+'">'+(r.score>=pl?'合格':'不合格')+'</td>'+
       '<td style="text-align:left;font-size:11px">'+esc(det)+'</td></tr>';
  });
  h+='</table>';
  document.getElementById("adminList").innerHTML=h;
}
function clearAll(){
  if(!confirm("确定清空全部云端答卷记录？此操作不可恢复！"))return;
  syncTip("清空中…");
  fetch(GH+"/contents/data?ref=main",{headers:ghH()}).then(function(r){return r.json()}).then(function(list){
    if(!Array.isArray(list))return[];
    return Promise.all(list.map(function(f){
      return fetch(GH+"/contents/"+f.path,{method:"DELETE",headers:ghH(),
        body:JSON.stringify({message:"del",branch:"main",sha:f.sha})}).catch(function(){});
    }));
  }).then(function(){saveLocalCache([]);CLOUD=[];renderAdmin();syncTip("已清空 ✓")})
   .catch(function(){syncTip("清空失败，请重试")});
}
function exportCSV(){
  var all=mergedRecs(),f=document.getElementById("paperFilter").value;
  var view=f?all.filter(function(r){return r.paperTitle===f}):all;
  if(!view.length){alert("暂无记录可导出");return}
  var maxN=Math.max.apply(null,view.map(function(r){return r.detail.length}));
  var rows=[["姓名","试卷","提交时间","总分","合格判定"]];
  for(var i=0;i<maxN;i++)rows[0].push("第"+(i+1)+"题");
  view.forEach(function(r){
    rows.push([r.name,r.paperTitle||"",r.time,r.score,r.score>=60?"合格":"不合格"].concat(
      r.detail.map(function(d){
        return Array.isArray(d.my)?(d.my.length?d.my.map(function(v){return "ABCD"[v]}).join(""):"未答"):(d.my<0?"未答":"ABCD"[d.my]);
      })));
  });
  var csv="\uFEFF"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="答卷记录_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
}

/* ================= 启动 ================= */
document.getElementById("pwdInput").addEventListener("keydown",function(e){if(e.key==="Enter")adminLogin()});
document.getElementById("nameInput").addEventListener("keydown",function(e){if(e.key==="Enter")startExam()});
loadPapers(function(list){PAPERS=list;renderHome()});
</script>
